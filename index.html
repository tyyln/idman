<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Antrenman</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0071e3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Antrenman">
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface2: #f5f5f7;
    --border: #d2d2d7;
    --border-light: rgba(0,0,0,0.06);
    --text: #1d1d1f;
    --text-muted: #6e6e73;
    --text-secondary: #86868b;
    --nav-icon-color: #86868b;
    --accent: #0071e3;
    --accent-soft: rgba(0,113,227,0.08);
    --accent-hover: #0077ed;
    --green: #34c759;
    --green-soft: rgba(52,199,89,0.1);
    --orange: #ff9500;
    --red: #ff3b30;
    --radius: 18px;
    --radius-sm: 10px;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --shadow-md: 0 4px 24px rgba(0,0,0,0.1);
  }

  [data-theme="dark"] {
    --bg: #000000;
    --surface: #1c1c1e;
    --surface2: #2c2c2e;
    --border: #3a3a3c;
    --border-light: rgba(255,255,255,0.08);
    --text: #f5f5f7;
    --text-muted: #8d8d93;
    --text-secondary: #8d8d93;
    --nav-icon-color: rgba(255,255,255,0.75);
    --accent: #0a84ff;
    --accent-soft: rgba(10,132,255,0.15);
    --accent-hover: #409cff;
    --green: #30d158;
    --green-soft: rgba(48,209,88,0.15);
    --orange: #ff9f0a;
    --red: #ff453a;
    --shadow: 0 2px 12px rgba(0,0,0,0.4);
    --shadow-md: 0 4px 24px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body, .sidebar, .modal, .workout-card, .progress-wrap,
  .day-tabs-wrap, .week-item, .set-input, .readonly-banner {
    transition: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
  }

  body {
    font-family: -apple-system, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── SIDEBAR ── */
  .sidebar-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    left: 52px; /* Don't cover the left column on desktop */
  }
  .sidebar-overlay.open { opacity: 1; pointer-events: all; }



  .sidebar-header {
    padding: 28px 20px 16px;
    border-bottom: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-header h2 { font-size: 17px; font-weight: 600; color: var(--text); letter-spacing: -0.3px; }
  .sidebar-close {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: none;
    background: var(--surface2);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    transition: all 0.15s;
    font-weight: 600;
  }
  .sidebar-close:hover { background: var(--border); color: var(--text); }

  .sidebar-body {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .week-item {
    padding: 11px 20px;
    cursor: pointer;
    transition: background 0.12s;
    border-radius: 0;
    margin: 1px 8px;
    border-radius: 10px;
  }
  .week-item:hover { background: rgba(0,0,0,0.04); }
  .week-item.active { background: var(--accent-soft); }
  .week-item-label {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.1px;
  }
  .week-item.active .week-item-label { color: var(--accent); }
  .week-item-sub {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .week-item-badge {
    display: inline-block;
    margin-top: 4px;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    background: var(--green-soft);
    color: var(--green);
    font-weight: 600;
  }

  .sidebar-section-title {
    font-size: 11px;
    text-transform: none;
    letter-spacing: 0.8px;
    color: var(--text-secondary);
    padding: 14px 20px 6px;
    font-weight: 700;
  }

  /* ── MAIN ── */
  .main {
    padding: 28px 24px 80px;
    max-width: 500px;
    margin: 0;
  }

  /* ── HEADER ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    gap: 10px;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.6px;
    color: var(--text);
  }
  .header-sub {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
    letter-spacing: -0.1px;
  }
  .btn-icon {
    background: var(--surface);
    border: none;
    color: var(--text-muted);
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: background 0.15s;
    flex-shrink: 0;
    box-shadow: var(--shadow);
  }
  .btn-icon:hover { background: var(--border); color: var(--text); }

  /* ── TIMER BAR ── */
  .timer-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 18px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 16px;
  }
  .timer-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    line-height: 1;
    padding: 0;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: transform 0.15s, background 0.2s;
    position: relative;
  }
  .timer-btn::before {
    content: '';
    display: block;
    width: 0; height: 0;
    border-style: solid;
    border-width: 6px 0 6px 11px;
    border-color: transparent transparent transparent #fff;
    margin-left: 2px;
  }
  .timer-btn.running::before { display: none; }
  .timer-btn::after {
    content: '';
    display: block;
    width: 10px; height: 10px;
    background: #fff;
    border-radius: 2px;
    opacity: 0;
    position: absolute;
  }
  .timer-btn.running::after { opacity: 1; }
  .timer-btn.running { font-size: 0; }
  .timer-btn:active { transform: scale(0.92); }
  .timer-btn.running { background: #ff3b30; }
  .timer-display {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    letter-spacing: -0.5px;
    min-width: 58px;
  }
  .timer-label {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  /* readonly banner */
  .readonly-banner {
    border: none;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--accent);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
  }

  /* ── DAY TABS ── */
  .day-tabs-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 24px;
    background: var(--surface);
    border-radius: 14px;
    padding: 6px;
    box-shadow: var(--shadow);
  }
  .day-tabs-arrow {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: all 0.15s;
    user-select: none;
    font-weight: 600;
  }
  .day-tabs-arrow:hover { background: var(--surface2); }
  .day-tabs-arrow:disabled { opacity: 0.2; cursor: default; background: transparent; }
  .day-tabs {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    flex: 1;
    scrollbar-width: none;
    scroll-behavior: smooth;
  }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab {
    flex-shrink: 0;
    padding: 7px 14px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    font-family: -apple-system, 'SF Pro Text', sans-serif;
    letter-spacing: -0.1px;
  }
  .day-tab:hover { background: var(--surface2); color: var(--text); }
  .day-tab.active {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,113,227,0.3);
  }
  .day-tab.has-program::after {
    content: '•';
    margin-left: 5px;
    color: var(--green);
    font-size: 10px;
  }
  .day-tab.active.has-program::after { color: rgba(255,255,255,0.7); }

  /* ── WORKOUT CARD ── */
  .workout-card {
    background: var(--surface);
    border: none;
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: box-shadow 0.2s, transform 0.15s, border 0.15s;
    user-select: none;
    -webkit-user-select: none;
  }
  .workout-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .workout-card.drag-over { border: 2px solid var(--accent); transform: scale(1.01); }
  .workout-card.completed {
    background: linear-gradient(135deg, var(--surface) 0%, var(--green-soft) 100%);
  }
  .workout-card-header {
    display: flex;
    align-items: center;
    padding: 16px 18px;
    gap: 14px;
    cursor: pointer;
  }
  .exercise-icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .exercise-icon-btn {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--surface2);
    border: none;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    cursor: pointer;
    transition: background 0.15s;
    line-height: 1;
    padding: 0;
  }
  .exercise-icon-btn:hover { background: var(--accent-soft); }
  .exercise-name { font-size: 15px; font-weight: 600; flex: 1; letter-spacing: -0.2px; }
  .exercise-meta {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 3px;
    letter-spacing: -0.1px;
  }
  .exercise-check {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 12px;
    transition: all 0.3s;
    color: transparent;
  }
  .workout-card.completed .exercise-check {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
    animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1);
    cursor: pointer;
  }
  .workout-card.completed .exercise-check:hover {
    background: var(--orange);
    border-color: var(--orange);
    transform: scale(1.1);
  }
  @keyframes pop {
    0% { transform: scale(0.5); }
    100% { transform: scale(1); }
  }

  /* ── SETS ── */
  .sets-container { padding: 0 18px; max-height: 0; overflow: hidden; transition: max-height 0.3s cubic-bezier(0.4,0,0.2,1), padding 0.3s ease; }
  .sets-container.open { max-height: 2000px; padding: 0 18px 16px; }
  .set-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-top: 1px solid rgba(0,0,0,0.06);
    transition: all 0.3s;
  }
  .set-row.set-done { opacity: 1; }
  .set-row.set-done .set-label,
  .set-row.set-done .set-input,
  .set-row.set-done .set-input-label { opacity: 0.4; }
  .set-row.set-done .btn-set-done { opacity: 1; }
  .set-label {
    font-size: 12px;
    color: var(--text-secondary);
    width: 42px;
    flex-shrink: 0;
    font-weight: 500;
    letter-spacing: -0.1px;
  }
  .set-input-group { display: flex; align-items: center; gap: 6px; flex: 1; }
  .set-input {
    background: var(--surface2);
    border: none;
    border-radius: 8px;
    color: var(--text);
    font-family: -apple-system, 'SF Pro Text', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 7px 10px;
    width: 68px;
    text-align: center;
    transition: box-shadow 0.15s, background 0.15s;
  }
  .set-input:focus { outline: none; background: var(--surface2); box-shadow: 0 0 0 3px rgba(0,113,227,0.2); }
  .set-input:disabled { opacity: 0.45; cursor: not-allowed; }
  .set-input::-webkit-outer-spin-button,
  .set-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .set-input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  .set-input-label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
  .btn-set-done {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .btn-set-done:hover { border-color: var(--green); color: var(--green); background: var(--green-soft); }
  .set-row.set-done .btn-set-done {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
    animation: pop 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }

  .exercise-note {
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--surface2);
    border-radius: 8px;
    padding: 8px 10px;
    margin-top: 8px;
    line-height: 1.5;
    word-break: break-word;
  }

  /* ── HISTORY SET ROW ── */
  .hist-set-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-top: 1px solid rgba(0,0,0,0.06);
  }
  .hist-set-done { color: var(--green); font-size: 14px; font-weight: 600; }
  .hist-set-skip { color: var(--border); font-size: 13px; }
  .hist-val {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 500;
    letter-spacing: -0.1px;
  }

  /* ── PROGRESS BAR ── */
  .progress-wrap {
    background: var(--surface);
    border: none;
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 10px;
    font-weight: 500;
    letter-spacing: -0.1px;
  }
  .progress-label span:last-child { color: var(--accent); font-weight: 600; }
  .progress-bar {
    height: 5px;
    background: var(--surface2);
    border-radius: 10px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #34C759;
    border-radius: 10px;
    transition: width 0.6s cubic-bezier(0.34,1.3,0.64,1);
    width: 0%;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 56px 24px;
    color: var(--text-secondary);
  }
  .empty-state .emoji { font-size: 44px; margin-bottom: 14px; }
  .empty-state p { font-size: 15px; line-height: 1.6; color: var(--text-secondary); letter-spacing: -0.1px; }
  .empty-state-animate {
    opacity: 0;
    filter: blur(8px);
    transform: scale(0.97);
    transition: opacity 0.45s ease, filter 0.45s ease, transform 0.45s ease;
  }
  .empty-state-animate.visible {
    opacity: 1;
    filter: blur(0px);
    transform: scale(1);
  }

  /* ── MODALS ── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--modal-glass, rgba(255,255,255,0.96));
    backdrop-filter: saturate(180%) blur(20px);
    border: none;
    border-radius: 22px 22px 0 0;
    padding: 28px 24px 40px;
    width: 100%;
    max-width: 500px;
    max-height: 85vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(0.4,0,0.2,1);
    -webkit-overflow-scrolling: touch;
  }
  .overlay.open .modal { transform: translateY(0); }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 22px; letter-spacing: -0.4px; }
  .modal-field { margin-bottom: 14px; }
  .modal-field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 600; text-transform: none; letter-spacing: 0.3px; }
  .modal-field input, .modal-field select {
    width: 100%;
    background: var(--surface2);
    border: none;
    border-radius: 12px;
    color: var(--text);
    font-family: -apple-system, 'SF Pro Text', sans-serif;
    font-size: 15px;
    padding: 12px 14px;
    transition: box-shadow 0.15s;
    -webkit-appearance: none;
  }
  .modal-field input[type=number]::-webkit-outer-spin-button,
  .modal-field input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .modal-field input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  }
  .modal-field input:focus, .modal-field select:focus { outline: none; box-shadow: 0 0 0 3px rgba(0,113,227,0.2); background: var(--surface); }
  .modal-row { display: flex; gap: 10px; }
  .modal-row .modal-field { flex: 1; }
  .btn-primary {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-family: -apple-system, 'SF Pro Text', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.15s;
    letter-spacing: -0.2px;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-cancel {
    width: 100%;
    padding: 13px;
    border-radius: 14px;
    border: none;
    background: var(--surface2);
    color: var(--text-secondary);
    font-family: -apple-system, 'SF Pro Text', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s;
  }
  .btn-cancel:hover { background: var(--border); color: var(--text); }

  /* ── FLASH ── */
  .flash {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(52,199,89,0.95);
    backdrop-filter: blur(12px);
    color: #fff;
    padding: 16px 28px;
    border-radius: 20px;
    font-size: 17px;
    font-weight: 600;
    z-index: 200;
    pointer-events: none;
    text-align: center;
    white-space: nowrap;
    box-shadow: 0 8px 32px rgba(52,199,89,0.35);
    letter-spacing: -0.2px;
  }
  .flash.show {
    animation: flashPop 1.8s cubic-bezier(0.34,1.3,0.64,1) forwards;
  }
  @keyframes flashPop {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    15% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
    25% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    70% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0; }
  }

  .btn-delete-ex {
    background: none; border: none;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 12px;
    width: 26px; height: 26px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    opacity: 0;
    flex-shrink: 0;
  }
  @keyframes blurOutFade {
    0%   { opacity: 1; transform: scale(1);    filter: blur(0px); }
    100% { opacity: 0; transform: scale(0.96); filter: blur(8px); }
  }
  @keyframes collapseHeight {
    0%   { max-height: 300px; margin-bottom: 10px; }
    100% { max-height: 0;     margin-bottom: 0; }
  }
  .workout-card.adding {
    animation: cardAdd 0.45s cubic-bezier(0.34,1.2,0.64,1) forwards;
  }
  @keyframes cardAdd {
    0%   { opacity: 0; transform: scale(0.95) translateY(8px); filter: blur(8px); }
    100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0px); }
  }

  .btn-delete-ex { opacity: 0.4; }
  .workout-card:hover .btn-delete-ex { opacity: 1; }
  .btn-delete-ex:hover { color: var(--red); background: rgba(255,59,48,0.1); }

  .btn-delete {
    background: none; border: none;
    color: var(--text-secondary);
    cursor: pointer; font-size: 15px;
    padding: 4px 6px; border-radius: 8px;
    transition: color 0.15s, background 0.15s;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-delete:hover { color: var(--red); background: rgba(255,59,48,0.08); }

  .add-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--accent);
    background: var(--accent-soft);
    border: none;
    border-radius: 14px;
    padding: 13px 16px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    width: 100%;
    font-family: -apple-system, 'SF Pro Text', sans-serif;
    transition: all 0.15s;
    letter-spacing: -0.1px;
  }
  .add-btn:hover { background: rgba(0,113,227,0.12); }

  /* ── APP LAYOUT ── */
  body { display: flex; }

  .app-layout {
    display: flex;
    flex: 1;
    min-height: 100vh;
    position: relative;
  }

  /* ── LEFT COLUMN ── */
  .left-col {
    width: 52px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border-light);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 24px;
    gap: 12px;
    position: sticky;
    top: 0;
    height: 100vh;
    transition: background-color 0.5s ease, border-color 0.5s ease;
    z-index: 55;
  }

  .left-col-btn {
    width: 36px; height: 36px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: var(--nav-icon-color);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .left-col-btn svg { width: 20px; height: 20px; }
  .left-col-btn:hover { background: var(--surface2); color: var(--text); }
  .left-col-btn.active { background: var(--accent-soft); color: var(--accent); }

  .left-col-spacer { flex: 1; }

  /* ── SETTINGS MODAL ── */
  .settings-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .settings-overlay.open { opacity: 1; pointer-events: all; }

  .settings-sheet {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 40px;
    width: 100%;
    max-width: 480px;
    box-shadow: var(--shadow-md);
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  }
  .settings-overlay.open .settings-sheet { transform: translateY(0); }

  .settings-sheet-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 20px;
  }
  .sidebar-handle-bar {
    display: none;
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 12px auto 4px;
    flex-shrink: 0;
  }
  .settings-sheet h3 {
    font-size: 16px; font-weight: 700;
    letter-spacing: -0.3px;
    margin-bottom: 20px;
    color: var(--text);
  }
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-top: 1px solid var(--border-light);
  }
  .settings-row-label { font-size: 14px; font-weight: 500; color: var(--text); }
  .settings-row-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

  .unit-toggle {
    display: flex;
    background: var(--surface2);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
  }
  .unit-toggle-btn {
    padding: 6px 0;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s;
    font-family: -apple-system, 'SF Pro Text', sans-serif;
    flex: 1;
    text-align: center;
    min-width: 48px;
  }
  .unit-toggle-btn.active {
    background: var(--surface);
    color: var(--accent);
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }

  /* ── SIDEBAR (inline panel, not overlay) ── */
  .sidebar-overlay {
    display: block;
    background: rgba(0,0,0,0.3) !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    left: 0 !important;
    z-index: 19 !important;
    bottom: calc(64px + env(safe-area-inset-bottom)) !important;
  }
  .sidebar-overlay.open { opacity: 1; pointer-events: all; }

  .sidebar {
    position: fixed;
    top: 0;
    left: 52px;
    bottom: 0;
    width: 0;
    background: var(--surface);
    border-right: 1px solid var(--border-light);
    z-index: 60;
    overflow: hidden;
    transition: width 0.3s cubic-bezier(0.4,0,0.2,1), box-shadow 0.3s ease;
    display: flex;
    flex-direction: column;
  }
  .sidebar.open {
    width: 400px;
    box-shadow: 4px 0 24px rgba(0,0,0,0.08);
  }
  [data-theme="dark"] .sidebar.open {
    box-shadow: 4px 0 24px rgba(0,0,0,0.4);
  }

  .sidebar-header {
    padding: 24px 20px 14px;
    border-bottom: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .sidebar-header h2 { font-size: 15px; font-weight: 600; }
  .sidebar-close { display: flex; }
  .sidebar-handle-bar { display: block; }

  .sidebar-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 0;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
  }

  .week-item { border-radius: 10px; margin: 1px 8px; }

  /* ── MAIN ── */
  .main {
    flex: 1;
    padding: 28px 28px 80px;
    max-width: 560px;
    min-width: 0;
    margin: 0 auto;
    transition: background-color 0.5s ease;
  }
  /* Hide bottom nav on desktop — defined here, overridden in mobile media query below */
  .bottom-nav { display: none; }
  .mobile-header-actions { display: none; }
</style>
</head>
<body>

<div class="flash" id="flash"></div>

<div class="app-layout">

<!-- Left column -->
<div class="left-col">

<!-- Settings Sheet -->

    </div>
    <div class="settings-row">
      <div>
        <div class="settings-row-label" data-i18n="language"></div>
        <div class="settings-row-sub" data-i18n="languageSub"></div>
      </div>
      <div class="unit-toggle">
        <button class="unit-toggle-btn active" id="langEnBtn" onclick="setLanguage('en')">EN</button>

      </div>
      <div class="unit-toggle">
        <button class="unit-toggle-btn" id="settingsThemeBtn" onclick="toggleTheme()">🌙</button>

    </div>
    <div class="settings-row" style="flex-direction:column;align-items:flex-start;gap:12px;width:100%">
      <div>
        <div class="settings-row-label" data-i18n="accentColor"></div>
        <div class="settings-row-sub" data-i18n="accentColorSub"></div>
      </div>
      <div id="accentSwatches" style="display:grid;grid-template-columns:repeat(4,32px);gap:10px;margin:0 auto;align-self:center"></div>
    </div>
    <div class="settings-row" style="justify-content:space-between">
      <div>
        <div class="settings-row-label" data-i18n="backupLabel"></div>
        <div class="settings-row-sub" data-i18n="backupSub"></div>
      </div>

    </div>
    <div class="settings-row" style="justify-content:space-between">
      <div>
        <div class="settings-row-label" data-i18n="restoreLabel"></div>
        <div class="settings-row-sub" data-i18n="restoreSub"></div>
      </div>
      <button onclick="document.getElementById('importInput').click()" style="padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap" data-i18n="backupImport"></button>
      <input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </div>
</div>

<!-- Sidebar panel -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-handle-bar"></div>
  <div class="sidebar-header">
    <h2 id="sidebarTitle">📅 <span data-i18n="weekHistory"></span></h2>
    <button class="sidebar-close" onclick="closeSidebar()">✕</button>
  </div>
  <div class="sidebar-body" id="sidebarBody"></div>
</div>

<!-- Main -->
<div class="main">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div>
        <h1 id="header-title">Antrenman</h1>
        <div class="header-sub" id="header-sub">Bugün ne çalışıyoruz?</div>
      </div>
    </div>
    <button class="btn-icon" id="themeBtn" onclick="toggleTheme()" title="Tema değiştir" style="display:none">🌙</button>
  </div>

  <!-- Workout Timer Bar -->
  <div class="timer-bar" id="timerBar">
    <button class="timer-btn" id="timerBtn" onclick="toggleWorkout()"></button>
    <span class="timer-display" id="timerDisplay">00:00</span>
    <span class="timer-label" id="timerLabel" data-i18n="startWorkout"></span>
    <button id="newWorkoutBtn" onclick="startNewWorkout()" style="display:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--text-secondary);cursor:pointer;white-space:nowrap" data-i18n="newWorkout"></button>
    <button id="viewSummaryBtn" onclick="showWorkoutSummary(workoutElapsedOnStop, (!viewingWeek && activeDay !== getTodayIndex()) || !!viewingWeek)" style="display:none;margin-left:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--text-secondary);cursor:pointer;white-space:nowrap" data-i18n="viewSummary"></button>
  </div>

  <!-- Readonly banner -->
  <div class="readonly-banner" id="readonlyBanner" style="display:none">
    📖 <span data-i18n="readonlyBanner"></span>
  </div>

  <!-- Day Tabs -->
  <div class="day-tabs-wrap">
    <button class="day-tabs-arrow" id="arrowLeft" onclick="scrollTabs(-1)">‹</button>

    <div id="content" style="min-height:80px;padding-bottom:40px;padding-top:16px"></div>
    <button class="add-btn" id="addExBtn" onclick="openEditDayModal()" style="opacity:0;filter:blur(8px);transition:opacity 0.4s ease,filter 0.4s ease;margin-top:0;">+ <span data-i18n="addExercise"></span></button>
  </div>
</div>
</div><!-- end app-layout -->

<!-- Workout Summary Modal -->
<div class="overlay" id="workoutSummaryOverlay" onclick="if(event.target===this)closeWorkoutSummary()" style="align-items:center">
  <div class="modal" id="workoutSummaryModal" style="max-width:340px;border-radius:22px;transform:scale(0.92);transition:transform 0.28s cubic-bezier(0.4,0,0.2,1),opacity 0.28s;opacity:0">

        <span id="editSupersetThumb" style="position:absolute;left:2px;top:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left 0.2s;box-shadow:0 1px 4px rgba(0,0,0,0.2)"></span>

    <button class="btn-primary" onclick="saveEditExercise()" data-i18n="save"></button>
    <button class="btn-cancel" onclick="closeEditExerciseModal()" data-i18n="cancel"></button>

</div>

<script>
// ── i18n ──
const I18N = {
  tr: {
    days: ['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'],

let lang = 'en';

function t(key, ...args) {
  const val = I18N[lang][key];
  return typeof val === 'function' ? val(...args) : (val || key);
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    el.textContent = t(key);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    el.placeholder = t(key);
  });
  document.getElementById('langTrBtn')?.classList.toggle('active', lang === 'tr');
  document.getElementById('langEnBtn')?.classList.toggle('active', lang === 'en');
  // Update timer label if active
  if (document.getElementById('timerLabel')) {
    document.getElementById('timerLabel').textContent = t(workoutActive ? 'stopWorkout' : 'startWorkout');
  }
}

function refreshActivePanel() {
  if (!activePanel) return;
  // Başlığı güncelle
  const titleEl = document.getElementById('sidebarTitle');
  if (titleEl) {
    const iconSvg = ICONS[activePanel] || '';
    titleEl.innerHTML = `<span style="display:inline-flex;align-items:center;gap:8px;vertical-align:middle">${iconSvg} ${t(activePanel + 'Panel')}</span>`;
  }
  if (activePanel === 'history') renderSidebar();
  else if (activePanel === 'progress') renderProgressPanel();
  else if (activePanel === 'weight') renderWeightPanel();
}

function setLanguage(l) {
  lang = l;
  try { localStorage.setItem('antrenman_lang', l); } catch(e) {}
  render();
  applyI18n();
  refreshActivePanel();
}

const STORAGE_KEY = 'antrenman_v2';
const HISTORY_KEY = 'antrenman_history_v1';

let state = loadState();
let history = loadHistory();
let activeDay = getTodayIndex();

// Load sessionSets: only restore if saved week key matches current week
const SESSION_KEY = 'antrenman_session_v1';
function loadSession() {
  try {
    const saved = localStorage.getItem(SESSION_KEY);
    if (saved) {
      const { weekKey, sets } = JSON.parse(saved);
      if (weekKey === getCurrentWeekKey()) return sets;
    }
  } catch(e) {}
  return {};
}
function saveSession() {
  try {
    const setsToSave = {};
    Object.entries(sessionSets).forEach(([k, v]) => {
      if (k !== '_savedWeekKey') setsToSave[k] = v;
    });
    localStorage.setItem(SESSION_KEY, JSON.stringify({ weekKey: getCurrentWeekKey(), sets: setsToSave }));
  } catch(e) {}
}

let sessionSets = loadSession();
let _sessionWeekKey = getCurrentWeekKey();
// Startup'ta da hafta kontrolü — eski session varsa temizle
if (Object.keys(sessionSets).length > 0) {
  const savedData = localStorage.getItem('antrenman_session_v1');
  if (savedData) {
    try {
      const { weekKey } = JSON.parse(savedData);
      if (weekKey !== _sessionWeekKey) {
        sessionSets = {};
        saveSession();
      }
    } catch(e) { sessionSets = {}; }
  }
}

// viewingWeek: null = bu hafta (live), string = geçmiş hafta key (readonly)
let viewingWeek = null;

// ── CARRY OVER LAST WEEK VALUES ──
// On startup, find the most recent past week and copy its completed
// kg/reps into state.days[].exercises[].lastKg/lastReps so they
// appear as placeholders this week.
function carryOverLastWeek() {
  const currentKey = getCurrentWeekKey();
  const pastKeys = Object.keys(history)
    .filter(k => k < currentKey)
    .sort((a, b) => b.localeCompare(a));
  if (pastKeys.length === 0) return;

  const lastWeek = history[pastKeys[0]];
  if (!lastWeek?.sets) return;

  state.days.forEach((day, di) => {
    day.exercises.forEach((ex, ei) => {
      for (let s = 0; s < ex.sets; s++) {
        const key = `${di}-${ei}-${s}`;
        const sd = lastWeek.sets[key];
        if (sd?.done) {
          if (!ex.lastKg) ex.lastKg = [];
          if (!ex.lastReps) ex.lastReps = [];
          if (ex.lastKg[s] === undefined) ex.lastKg[s] = sd.kg;
          if (ex.lastReps[s] === undefined) ex.lastReps[s] = sd.reps;
        }
      }
    });
  });
}
carryOverLastWeek();

// ── WEEK KEY ──
function getWeekKey(date) {
  const d = new Date(date);
  const day = d.getDay();
  const mon = new Date(d);
  mon.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  return mon.toISOString().slice(0,10);
}

function getCurrentWeekKey() { return getWeekKey(new Date()); }

function weekLabel(key) {
  const start = new Date(key);
  const end = new Date(key);
  end.setDate(end.getDate() + 6);
  const monthsTR = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  const monthsEN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const months = lang === 'en' ? monthsEN : monthsTR;
  const fmt = (d) => `${d.getDate()} ${months[d.getMonth()]}`;
  const currentYear = new Date().getFullYear();
  const yearSuffix = start.getFullYear() !== currentYear ? ` ${start.getFullYear()}` : '';
  return `${fmt(start)}${yearSuffix} – ${fmt(end)}${yearSuffix}`;
}

function getDayName(day, i) {
  // If the day has a custom name (not any of the default day names in any language), use it
  const allDefaults = [...I18N['tr'].days, ...I18N['en'].days];
  if (day && day.name && !allDefaults.includes(day.name)) return day.name;
  return I18N[lang].days[i];
}

function getTodayIndex() {
  const d = new Date().getDay();
  return d === 0 ? 6 : d - 1;
}

// ── STORAGE ──
function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return { days: I18N['tr'].days.map(name => ({ name, exercises: [] })) };
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function loadHistory() {
  try {
    const saved = localStorage.getItem(HISTORY_KEY);
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return {};
}

function saveHistory() {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch(e) {}
}

// Save current week session when switching or closing
function saveCurrentWeekToHistory() {
  const doneSets = Object.entries(sessionSets).filter(([k, s]) => s?.done);
  if (doneSets.length === 0) return;
  const weekKey = getCurrentWeekKey();
  if (!history[weekKey]) {
    history[weekKey] = { sets: {}, days: JSON.parse(JSON.stringify(state.days)) };
  }
  Object.entries(sessionSets).forEach(([k, v]) => {
    history[weekKey].sets[k] = v;
  });

  // Keep lastKg/lastReps up to date in state for next week's placeholders
  state.days.forEach((day, di) => {
    day.exercises.forEach((ex, ei) => {
      for (let s = 0; s < ex.sets; s++) {
        const sd = sessionSets[`${di}-${ei}-${s}`];
        if (sd?.done) {
          if (!ex.lastKg) ex.lastKg = [];
          if (!ex.lastReps) ex.lastReps = [];
          ex.lastKg[s] = sd.kg;
          ex.lastReps[s] = sd.reps;
        }
      }
    });
  });
  saveState();
  saveHistory();
  saveSession();
}

function openPanel(panel) {

  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('open');

  ['history','progress','weight'].forEach(p => {

    const btn = document.getElementById('navBtn' + key);
    if (btn) btn.classList.toggle('active', p === panel);
    const mBtn = document.getElementById('mobileNav' + key);
    if (mBtn) mBtn.classList.toggle('active', p === panel);
  });
  const titleEl = document.getElementById('sidebarTitle');
  if (titleEl) {
    const iconSvg = ICONS[panel] || '';
    titleEl.innerHTML = `<span style="display:inline-flex;align-items:center;gap:8px;vertical-align:middle">${iconSvg} ${t(panel + 'Panel')}</span>`;
  }
  if (panel === 'history') renderSidebar();
  else if (panel === 'progress') renderProgressPanel();

  requestAnimationFrame(() => {
    const sb = document.getElementById('sidebarBody');
    if (sb) sb.scrollTop = 0;

}

function closeSidebar() {
  activePanel = null;
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.remove('open');
  if (sidebar._swipeInit) { sidebar._swipeInit = false; }
  document.getElementById('sidebarOverlay').classList.remove('open');
  document.body.style.overflow = '';

    const btn = document.getElementById('navBtn' + p);
    if (btn) btn.classList.remove('active');
    const mBtn = document.getElementById('mobileNav' + p);
    if (mBtn) mBtn.classList.remove('active');

}

function renderSidebar() {
  const body = document.getElementById('sidebarBody');
  body.innerHTML = '';
  const currentKey = getCurrentWeekKey();

  // Current week
  const curDiv = document.createElement('div');
  curDiv.innerHTML = `<div class="sidebar-section-title">${t('thisWeek')}</div>`;
  const curItem = document.createElement('div');
  curItem.className = 'week-item' + (viewingWeek === null ? ' active' : '');
  const curSets = Object.values(sessionSets).filter(s => s.done).length;
  curItem.innerHTML = `
    <div class="week-item-label">${t('now')}</div>
    <div class="week-item-sub">${weekLabel(currentKey)}</div>
    ${curSets > 0 ? `<span class="week-item-badge">${t('setsDoneBadge', curSets)}</span>` : ''}
  `;
  curItem.onclick = () => { viewingWeek = null; sessionSets = JSON.parse(JSON.stringify(sessionSets)); closeSidebar(); render(); };
  body.appendChild(curDiv);
  body.appendChild(curItem);

  // Past weeks
  const pastKeys = Object.keys(history)
    .filter(k => k !== currentKey)
    .sort((a, b) => b.localeCompare(a));

  if (pastKeys.length > 0) {
    const pastDiv = document.createElement('div');
    pastDiv.innerHTML = `<div class="sidebar-section-title" style="margin-top:16px">${t('pastWeeks')}</div>`;
    body.appendChild(pastDiv);

    pastKeys.forEach(key => {
      const hw = history[key];
      const doneSets = Object.values(hw.sets || {}).filter(s => s.done).length;
      const item = document.createElement('div');
      item.className = 'week-item' + (viewingWeek === key ? ' active' : '');
      item.innerHTML = `
        <div class="week-item-label">${weekLabel(key)}</div>
        <div class="week-item-sub">${key}</div>
        ${doneSets > 0 ? `<span class="week-item-badge">${t('setsDoneBadge', doneSets)}</span>` : `<span style="font-size:12px;color:var(--text-muted)">${t('noRecord')}</span>`}
      `;
      item.onclick = () => { viewingWeek = key; activeDay = getTodayIndex(); render(); closeSidebar(); };
      body.appendChild(item);
    });
  } else {
    const empty = document.createElement('div');
    empty.style.cssText = 'padding:20px;text-align:center;font-size:13px;color:var(--text-muted)';
    empty.textContent = t('noHistory');
    body.appendChild(empty);
  }
}

// ── PROGRESS PANEL ──
function calcStreak() {
  const currentKey = getCurrentWeekKey();

  function isWeekActive(key) {
    const hw = history[key];
    if (!hw || !hw.sets) return false;
    return Object.values(hw.sets).some(s => s && s.done);
  }

  const thisWeekActive = Object.values(sessionSets).some(s => s && s.done);
  const allKeys = Object.keys(history).filter(k => k !== currentKey).sort();

  // Mevcut streak: bu haftadan veya geçen haftadan geriye say
  let current = 0;
  if (thisWeekActive) {
    current = 1;
    for (let i = allKeys.length - 1; i >= 0; i--) {
      if (isWeekActive(allKeys[i])) current++;
      else break;
    }
  } else {
    // Bu hafta aktif değil — geçen haftadan itibaren ardışık say
    for (let i = allKeys.length - 1; i >= 0; i--) {
      if (isWeekActive(allKeys[i])) current++;
      else break;
    }
  }

  // Tüm zamanların rekoru
  const allActiveKeys = [...allKeys, ...(thisWeekActive ? [currentKey] : [])];
  let best = 0, temp = 0;
  // Sadece history key'lerini kullan
  allKeys.forEach(key => {
    if (isWeekActive(key)) { temp++; best = Math.max(best, temp); }
    else temp = 0;
  });
  if (thisWeekActive) { temp++; best = Math.max(best, temp); }
  best = Math.max(best, current);

  return { current, best };
}

    </div>

  const tabBar = document.createElement('div');
  tabBar.style.cssText = 'display:flex;gap:4px;padding:12px 16px 0;border-bottom:1px solid var(--border-light);margin-bottom:4px;';

  let activeTab = 'chart';

  function makeTab(id, labelKey) {
    const btn = document.createElement('button');
    btn.dataset.tab = id;
    btn.textContent = t(labelKey);
    btn.style.cssText = `padding:12px 24px;border:none;background:none;cursor:pointer;font-size:15px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--text-secondary);transition:color 0.15s,border-color 0.15s;border-radius:0;flex:1;text-align:center;`;

        b.style.color = isActive ? 'var(--accent)' : 'var(--text-secondary)';
        b.style.borderBottomColor = isActive ? 'var(--accent)' : 'transparent';
      });
      contentWrap.innerHTML = '';
      if (id === 'chart') drawChartTab();
      else drawPRTab();
    };
    return btn;
  }

  const chartTab = makeTab('chart', 'progressChartTab');
  const prTab = makeTab('pr', 'progressPRTab');
  chartTab.style.color = 'var(--accent)';
  chartTab.style.borderBottomColor = 'var(--accent)';
  tabBar.appendChild(chartTab);
  tabBar.appendChild(prTab);
  body.appendChild(tabBar);

  const contentWrap = document.createElement('div');
  body.appendChild(contentWrap);
  requestAnimationFrame(() => initTabSwipe(contentWrap, tabBar));
  function drawChartTab() {
    // İsme göre unique egzersizler — ilk bulunan index'i kullan
    const seen = new Set();
    const exercises = [];
    state.days.forEach((day, di) => {
      day.exercises.forEach((ex, ei) => {
        if (!seen.has(ex.name)) {
          seen.add(ex.name);
          exercises.push({ name: ex.name, di, ei });
        }
      });
    });

    if (exercises.length === 0) {
      contentWrap.innerHTML = `<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:13px">${t('noDataYet')}</div>`;
      return;
    }

    let selectedIdx = 0;

    // Arama input
    const searchWrap = document.createElement('div');
    searchWrap.style.cssText = 'padding:12px 16px 4px;position:relative;';
    searchWrap.innerHTML = `
      <input id="chartSearch" type="text" placeholder="${lang === 'tr' ? 'Egzersiz ara...' : 'Search exercise...'}"
        style="width:100%;padding:10px 12px 10px 36px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;box-sizing:border-box;outline:none;">
      <svg style="position:absolute;left:28px;top:50%;transform:translateY(-50%);opacity:0.4" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    `;
    contentWrap.appendChild(searchWrap);

    // Egzersiz listesi (arama sonuçları)
    const listWrap = document.createElement('div');
    listWrap.style.cssText = 'padding:0 16px 8px;display:flex;flex-direction:column;gap:4px;max-height:160px;overflow-y:auto;';
    // Liste scroll'undan sidebar kapatma tetiklenmesin
    listWrap.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });
    listWrap.addEventListener('touchend', e => e.stopPropagation(), { passive: true });
    contentWrap.appendChild(listWrap);

    const chartWrap = document.createElement('div');
    chartWrap.style.cssText = 'padding:0 16px';
    contentWrap.appendChild(chartWrap);

    function renderList(filter) {
      listWrap.innerHTML = '';
      const filtered = exercises.filter(ex =>
        ex.name.toLowerCase().includes(filter.toLowerCase())
      );
      if (filtered.length === 0) {
        listWrap.innerHTML = `<div style="font-size:12px;color:var(--text-muted);padding:8px 0">${lang === 'tr' ? 'Sonuç yok' : 'No results'}</div>`;
        return;
      }
      filtered.forEach(ex => {
        const realIdx = exercises.indexOf(ex);
        const btn = document.createElement('button');
        btn.style.cssText = `text-align:left;padding:8px 12px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500;transition:background 0.15s;background:${realIdx === selectedIdx ? 'var(--accent)' : 'var(--surface2)'};color:${realIdx === selectedIdx ? '#fff' : 'var(--text)'};`;
        btn.textContent = ex.name;
        btn.onclick = () => {
          selectedIdx = realIdx;
          renderList(document.getElementById('chartSearch')?.value || '');
          drawChart(selectedIdx);
        };
        listWrap.appendChild(btn);
      });
    }

    renderList('');
    drawChart(0);
    requestAnimationFrame(() => {
      const searchInput = document.getElementById('chartSearch');
      if (searchInput) {
        searchInput.addEventListener('input', e => renderList(e.target.value));
      }
    });

    function drawChart(exIdx) {
      chartWrap.innerHTML = '';
      const ex = exercises[exIdx];
      const dataPoints = [];
      const currentKey = getCurrentWeekKey();
      const sortedKeys = Object.keys(history).sort().filter(k => k !== currentKey);
      sortedKeys.forEach(key => {
        const hw = history[key];
        if (!hw.sets) return;
        let maxKg = 0;
        // İsme göre egzersizi bul
        hw.days?.forEach((day, di) => {
          day.exercises?.forEach((hEx, ei) => {
            if (hEx.name !== ex.name) return;
            for (let s = 0; s < hEx.sets; s++) {
              const sd = hw.sets[`${di}-${ei}-${s}`];
              if (sd?.done && sd.kg) maxKg = Math.max(maxKg, parseFloat(sd.kg) || 0);
            }
          });
        });
        if (maxKg > 0) dataPoints.push({ label: weekLabel(key), kg: maxKg });
      });
      // Mevcut hafta — sessionSets'ten al
      let curMax = 0;
      state.days.forEach((day, di) => {
        day.exercises.forEach((sEx, ei) => {
          if (sEx.name !== ex.name) return;
          for (let s = 0; s < sEx.sets; s++) {
            const sd = sessionSets[`${di}-${ei}-${s}`];
            if (sd?.done && sd.kg) curMax = Math.max(curMax, parseFloat(sd.kg) || 0);
          }
        });
      });
      if (curMax > 0) dataPoints.push({ label: weekLabel(getCurrentWeekKey()) + ' (' + t('now') + ')', kg: curMax });

      if (dataPoints.length === 0) {
        chartWrap.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px">${t('noDataYet')}</div>`;
        return;
      }

      const maxVal = Math.max(...dataPoints.map(d => d.kg));
      const minVal = 0; // Her zaman 0'dan başlat
      const range = maxVal - minVal || 1;
      const BAR_W = 36, BAR_GAP = 16, H = 180, pad = 24;
      const W = Math.max(300, dataPoints.length * (BAR_W + BAR_GAP) + pad * 2);

      const scrollWrap = document.createElement('div');
      scrollWrap.style.cssText = 'overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px;padding-bottom:50px';

      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', `0 0 ${W} ${H + 50}`);
      svg.setAttribute('width', W);
      svg.setAttribute('height', H + 50);
      svg.style.cssText = 'display:block;min-width:100%;overflow:visible';

      dataPoints.forEach((d, i) => {
        const x = pad + i * (BAR_W + BAR_GAP);
        const barH = Math.max(8, (d.kg / range) * (H - 20) + 20);
        const y = H - barH;
        const isLast = i === dataPoints.length - 1;
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', x); rect.setAttribute('y', y);
        rect.setAttribute('width', BAR_W); rect.setAttribute('height', barH);
        rect.setAttribute('rx', 5);
        rect.setAttribute('fill', isLast ? 'var(--accent)' : 'var(--surface2)');
        svg.appendChild(rect);

        // Değer etiketi — bar içinde veya üstünde
        const val = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        val.setAttribute('x', x + BAR_W / 2);
        val.setAttribute('y', y > 12 ? y - 4 : y + 12);
        val.setAttribute('text-anchor', 'middle');
        val.setAttribute('font-size', '9');
        val.setAttribute('fill', y > 12 ? 'var(--text-secondary)' : '#fff');
        val.textContent = displayWeight(d.kg) + weightUnit;
        svg.appendChild(val);

        // Tarih etiketi — döndürülmüş
        const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        const lx = x + BAR_W / 2;
        const ly = H + 16;
        lbl.setAttribute('x', lx);
        lbl.setAttribute('y', ly);
        lbl.setAttribute('text-anchor', 'end');
        lbl.setAttribute('font-size', '8');
        lbl.setAttribute('fill', 'var(--text-muted)');
        lbl.setAttribute('transform', `rotate(-40, ${lx}, ${ly})`);
        if (d.label.includes('(')) {
          lbl.textContent = d.label.replace(/\s*\(.*\)/, '') + ' ★';
        } else {
          lbl.textContent = d.label;
        }
        svg.appendChild(lbl);
      });
      scrollWrap.appendChild(svg);
      chartWrap.appendChild(scrollWrap);
      requestAnimationFrame(() => { scrollWrap.scrollLeft = scrollWrap.scrollWidth; });
    }
  }

  // ── PR TAB ──
  function drawPRTab() {
    const allExercises = [];
    state.days.forEach((day, di) => {
      day.exercises.forEach((ex, ei) => {
        allExercises.push({ name: ex.name, di, ei });
      });
    });

    if (allExercises.length === 0) {
      contentWrap.innerHTML = `<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:13px">${t('noDataYet')}</div>`;
      return;
    }

    const list = document.createElement('div');
    list.style.cssText = 'padding:12px 16px calc(80px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;';

    // Önce tüm PR değerlerini hesapla
    const exWithPR = allExercises.map(ex => {
      let prKg = 0, prWeek = '';
      const sortedKeys = Object.keys(history).sort();
      sortedKeys.forEach(key => {
        const hw = history[key];
        if (!hw.sets) return;
        const dayEx = hw.days?.[ex.di]?.exercises?.[ex.ei];
        const exSets = dayEx?.sets || state.days[ex.di].exercises[ex.ei]?.sets || 3;
        for (let s = 0; s < exSets; s++) {
          const sd = hw.sets[`${ex.di}-${ex.ei}-${s}`];
          if (sd?.done && sd.kg) {
            const kg = parseFloat(sd.kg) || 0;
            if (kg > prKg) { prKg = kg; prWeek = weekLabel(key); }
          }
        }
      });
      const curEx = state.days[ex.di].exercises[ex.ei];
      if (curEx) {
        for (let s = 0; s < curEx.sets; s++) {
          const sd = sessionSets[`${ex.di}-${ex.ei}-${s}`];
          if (sd?.done && sd.kg) {
            const kg = parseFloat(sd.kg) || 0;
            if (kg > prKg) { prKg = kg; prWeek = t('now'); }
          }
        }
      }
      return { ...ex, prKg, prWeek };
    });

    // En yüksek PR üste gelsin, PR'sız olanlar en alta
    exWithPR.sort((a, b) => b.prKg - a.prKg);

    exWithPR.forEach(({ name, prKg, prWeek }) => {
      const row = document.createElement('div');
      row.style.cssText = `display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface2);border-radius:12px;gap:12px;`;

      const left = document.createElement('div');
      left.style.cssText = 'display:flex;align-items:center;gap:10px;min-width:0;';
      const trophy = document.createElement('span');
      trophy.textContent = '🏆';
      trophy.style.fontSize = '16px';
      const nameEl = document.createElement('div');
      nameEl.style.cssText = 'font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
      nameEl.textContent = name;
      left.appendChild(trophy);
      left.appendChild(nameEl);

      const right = document.createElement('div');
      right.style.cssText = 'text-align:right;flex-shrink:0;';
      if (prKg > 0) {
        const kg = document.createElement('div');
        kg.style.cssText = 'font-size:15px;font-weight:700;color:var(--accent);';
        kg.textContent = prKg + ' ' + weightUnit;
        const week = document.createElement('div');
        week.style.cssText = 'font-size:11px;color:var(--text-muted);margin-top:2px;';
        week.textContent = prWeek;
        right.appendChild(kg);
        right.appendChild(week);
      } else {
        right.innerHTML = `<span style="font-size:12px;color:var(--text-muted)">${t('noDataYet')}</span>`;
      }

      row.appendChild(left);
      row.appendChild(right);
      list.appendChild(row);
    });

    contentWrap.appendChild(list);
  }

  drawChartTab();
}

// ── WEIGHT PANEL ──
const WEIGHT_KEY = 'antrenman_weight_v1';
function loadWeightLog() {
  try { return JSON.parse(localStorage.getItem(WEIGHT_KEY) || '[]'); } catch(e) { return []; }
}
function saveWeightLog(log) {
  try { localStorage.setItem(WEIGHT_KEY, JSON.stringify(log)); } catch(e) {}
}

const BIO_KEY = 'antrenman_biometrics_v1';
const BIO_METRICS = [
  { id: 'height',   unit: () => lengthUnit,  tr: 'Boy',             en: 'Height',    once: true  },
  { id: 'bodyfat',  unit: () => '%',         tr: 'Vücut Yağ Oranı', en: 'Body Fat',  once: false },
  { id: 'waist',    unit: () => lengthUnit,  tr: 'Bel Çevresi',     en: 'Waist',     once: false },
  { id: 'shoulder', unit: () => lengthUnit,  tr: 'Omuz Genişliği',  en: 'Shoulders', once: false },
  { id: 'arm',      unit: () => lengthUnit,  tr: 'Kol Çevresi',     en: 'Arm',       once: false },
  { id: 'chest',    unit: () => lengthUnit,  tr: 'Göğüs Çevresi',   en: 'Chest',     once: false },
  { id: 'hip',      unit: () => lengthUnit,  tr: 'Kalça Çevresi',   en: 'Hip',       once: false },
  { id: 'thigh',    unit: () => lengthUnit,  tr: 'Uyluk Çevresi',   en: 'Thigh',     once: false },
];

function loadBioLog() {

}

function renderWeightPanel() {
  const body = document.getElementById('sidebarBody');
  body.innerHTML = '';
  body._tabSwipeInit = false;

  // ── BMI KARTI ──
  const bioLog = loadBioLog();
  const weightLog = loadWeightLog();
  const latestWeight = weightLog.length > 0 ? [...weightLog].sort((a,b) => b.date.localeCompare(a.date))[0].kg : null;
  const heightEntries = bioLog['height'] || [];
  const latestHeight = heightEntries.length > 0 ? heightEntries[heightEntries.length - 1].val : null;

  const bmiCard = document.createElement('div');
  bmiCard.style.cssText = 'margin:14px 16px 4px;border-radius:14px;overflow:hidden;border:1px solid var(--border-light);';

  if (latestWeight && latestHeight) {
    const heightM = latestHeight / 100;
    const bmi = Math.round((latestWeight / (heightM * heightM)) * 10) / 10;
    let category, color;
    if (bmi < 18.5)      { category = lang === 'tr' ? 'Zayıf'          : 'Underweight'; color = '#5ac8fa'; }
    else if (bmi < 25)   { category = lang === 'tr' ? 'Normal'         : 'Normal';      color = '#34c759'; }
    else if (bmi < 30)   { category = lang === 'tr' ? 'Fazla Kilolu'   : 'Overweight';  color = '#ff9500'; }
    else                 { category = lang === 'tr' ? 'Obez'           : 'Obese';       color = '#ff3b30'; }

    // BMI bar pozisyonu (10-40 arası)
    const pct = Math.min(100, Math.max(0, ((bmi - 10) / 30) * 100));

    bmiCard.innerHTML = `
      <div style="padding:14px 16px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div>
            <div style="font-size:11px;font-weight:600;color:var(--text-secondary);letter-spacing:0.5px;text-transform:uppercase">BMI</div>
            <div style="display:flex;align-items:baseline;gap:6px;margin-top:2px">
              <span style="font-size:28px;font-weight:700;color:${color}">${bmi}</span>
              <span style="font-size:13px;font-weight:600;color:${color}">${category}</span>
            </div>
          </div>
          <div style="text-align:right;font-size:11px;color:var(--text-muted);line-height:1.6">
            <div>${displayWeight(latestWeight)} ${weightUnit}</div>
            <div>${lengthUnit === 'in' ? (() => { const ft = Math.floor(latestHeight/2.54/12); const inch = Math.round(latestHeight/2.54 % 12); return `${ft}'${inch}"`; })() : `${latestHeight} cm`}</div>
          </div>
        </div>
        <div style="height:6px;border-radius:3px;background:linear-gradient(to right,#5ac8fa 0%,#34c759 30%,#ff9500 60%,#ff3b30 100%);position:relative">
          <div style="position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid ${color};box-shadow:0 1px 4px rgba(0,0,0,0.2);left:calc(${pct}% - 6px)"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:10px;color:var(--text-muted)">
          <span>10</span><span>18.5</span><span>25</span><span>30</span><span>40</span>
        </div>
      </div>
    `;
  } else {
    bmiCard.innerHTML = `
      <div style="padding:14px 16px;display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="font-size:11px;font-weight:600;color:var(--text-secondary);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px">BMI</div>
          <div style="font-size:13px;color:var(--text-muted)">${lang === 'tr' ? 'Boy ve ağırlık girince hesaplanır' : 'Enter height & weight to calculate'}</div>
        </div>
        <span style="font-size:24px">⚖️</span>
      </div>
    `;
  }
  body.appendChild(bmiCard);

  // ── TABS ──
  const tabBar = document.createElement('div');
  tabBar.style.cssText = 'display:flex;gap:4px;padding:12px 16px 0;border-bottom:1px solid var(--border-light);margin-bottom:4px;';

  let activeTab = 'weight';
  const contentWrap = document.createElement('div');

  function makeTab(id, label) {
    const btn = document.createElement('button');
    btn.dataset.tab = id;
    btn.textContent = label;
    btn.style.cssText = `padding:12px 24px;border:none;background:none;cursor:pointer;font-size:15px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--text-secondary);transition:color 0.15s,border-color 0.15s;border-radius:0;flex:1;text-align:center;`;
    btn.onclick = () => {
      activeTab = id;
      tabBar.querySelectorAll('button').forEach(b => {
        const isActive = b.dataset.tab === id;
        b.style.color = isActive ? 'var(--accent)' : 'var(--text-secondary)';
        b.style.borderBottomColor = isActive ? 'var(--accent)' : 'transparent';
      });
      contentWrap.innerHTML = '';
      if (id === 'weight') drawWeightTab();
      else drawBioTab();
    };
    return btn;
  }

  const weightTab = makeTab('weight', lang === 'tr' ? 'Ağırlık' : 'Weight');
  const bioTab = makeTab('bio', lang === 'tr' ? 'Ölçümler' : 'Metrics');
  weightTab.style.color = 'var(--accent)';
  weightTab.style.borderBottomColor = 'var(--accent)';
  tabBar.appendChild(weightTab);
  tabBar.appendChild(bioTab);
  body.appendChild(tabBar);
  body.appendChild(contentWrap);
  requestAnimationFrame(() => initTabSwipe(contentWrap, tabBar));
  function drawWeightTab() {
    const log = loadWeightLog();

    const inputRow = document.createElement('div');
    inputRow.style.cssText = 'display:flex;gap:8px;padding:16px;align-items:center';
    inputRow.innerHTML = `
      <style>#weightInput::-webkit-outer-spin-button,#weightInput::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}#weightInput{-moz-appearance:textfield}</style>
      <input id="weightInput" type="number" inputmode="decimal" step="0.1" min="0"
        placeholder="${t('weightPlaceholder')}"
        style="flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:15px;">
      <span style="color:var(--text-secondary);font-size:13px">${weightUnit}</span>
      <button onclick="addWeightEntry()" style="padding:10px 16px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap">${t('addWeight')}</button>
    `;
    contentWrap.appendChild(inputRow);

    if (log.length === 0) {
      const empty = document.createElement('div');
      empty.style.cssText = 'padding:20px;text-align:center;color:var(--text-muted);font-size:13px';
      empty.textContent = t('noWeightData');
      contentWrap.appendChild(empty);
      return;
    }

    const allSorted = [...log].sort((a, b) => a.date.localeCompare(b.date));
    const PT_GAP = 44, H = 130, pad = 20;
    const W = Math.max(300, (allSorted.length - 1) * PT_GAP + pad * 2);
    const maxV = Math.max(...allSorted.map(d => d.kg));
    const minV = Math.min(...allSorted.map(d => d.kg));
    const range = maxV - minV || 1;

    const scrollWrap = document.createElement('div');
    scrollWrap.style.cssText = 'overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0 16px;padding-bottom:4px';

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    if (allSorted.length === 1) {
      // Tek nokta — 100% genişlik, ortalanmış
      svg.setAttribute('viewBox', `0 0 ${W} ${H + 20}`);
      svg.setAttribute('width', '100%');
      svg.setAttribute('height', H + 20);
      svg.style.cssText = 'display:block';
    } else {
      svg.setAttribute('width', W); svg.setAttribute('height', H + 20);
      svg.style.cssText = 'display:block;min-width:100%';
    }

    if (allSorted.length > 1) {
      const points = allSorted.map((d, i) => {
        const x = pad + i * PT_GAP;
        const y = H - ((d.kg - minV) / range) * (H - 20) - 10;
        return `${x},${y}`;
      }).join(' ');
      const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      poly.setAttribute('points', points); poly.setAttribute('fill', 'none');
      poly.setAttribute('stroke', 'var(--accent)'); poly.setAttribute('stroke-width', '2.5');
      poly.setAttribute('stroke-linecap', 'round'); poly.setAttribute('stroke-linejoin', 'round');
      svg.appendChild(poly);
    }
    allSorted.forEach((d, i) => {
      const x = allSorted.length > 1 ? pad + i * PT_GAP : W / 2;
      const y = H - ((d.kg - minV) / range) * (H - 20) - 10;
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', x); circle.setAttribute('cy', y);
      circle.setAttribute('r', 4); circle.setAttribute('fill', 'var(--accent)');
      svg.appendChild(circle);
      const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      lbl.setAttribute('x', x); lbl.setAttribute('y', H + 14);
      lbl.setAttribute('text-anchor', 'middle');
      lbl.setAttribute('font-size', '9'); lbl.setAttribute('fill', 'var(--text-muted)');
      lbl.textContent = d.date.slice(5); svg.appendChild(lbl);
    });
    scrollWrap.appendChild(svg);
    contentWrap.appendChild(scrollWrap);
    requestAnimationFrame(() => { scrollWrap.scrollLeft = scrollWrap.scrollWidth; });

    const listWrap = document.createElement('div');
    listWrap.style.cssText = 'display:flex;flex-direction:column;gap:6px;margin-top:4px;padding:0 16px 16px';
    [...log].sort((a, b) => b.date.localeCompare(a.date)).forEach((entry, i) => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--surface2);border-radius:10px';
      row.innerHTML = `
        <span style="font-size:13px;color:var(--text-secondary)">${entry.date}</span>
        <span style="font-size:15px;font-weight:600;color:var(--text)">${displayWeight(entry.kg)} ${weightUnit}</span>
        <button onclick="deleteWeightEntry(${i})" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:16px;padding:0 4px">✕</button>
      `;
      listWrap.appendChild(row);
    });
    contentWrap.appendChild(listWrap);
  }

  // ── BIO TAB ──
  function drawBioTab() {
    const bioLog = loadBioLog();
    const wrap = document.createElement('div');
    wrap.style.cssText = 'padding:12px 16px calc(80px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;box-sizing:border-box;width:100%;white-space:normal;';

    function cmToFtIn(cm) {
      const totalIn = cm / 2.54;
      const ft = Math.floor(totalIn / 12);
      const inch = Math.round(totalIn % 12);
      return { ft, inch };
    }

    BIO_METRICS.forEach(metric => {
      const entries = bioLog[metric.id] || [];
      const latest = entries.length > 0 ? entries[entries.length - 1] : null;
      const isHeightInInches = metric.id === 'height' && lengthUnit === 'in';

      let latestDisplay = '', latestNum = '', latestUnit = metric.unit();
      if (latest) {
