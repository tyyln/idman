function loadBioLog() {
  try { return JSON.parse(localStorage.getItem(BIO_KEY) || '{}'); } catch(e) { return {}; }
}
function saveBioLog(log) {
  try { localStorage.setItem(BIO_KEY, JSON.stringify(log)); } catch(e) {}
}

function renderWeightPanel() {
  const body = document.getElementById('sidebarBody');
  body.innerHTML = '';
  body._tabSwipeInit = false;

  // ── BMI KARTI ──
  const bioLog = loadBioLog();
  const weightLog = loadWeightLog();
  const latestWeight = weightLog.length > 0 ? [...weightLog].sort((a,b) => b.date.localeCompare(a.date))[0].kg : null;
  const heightEntries = bioLog['height'] || [];
  const latestHeight = heightEntries.length > 0 ? heightEntries[heightEntries.length - 1].val : null;

  const bmiCard = document.createElement('div');
  bmiCard.style.cssText = 'margin:14px 16px 4px;border-radius:14px;overflow:hidden;border:1px solid var(--border-light);';

  if (latestWeight && latestHeight) {
    const heightM = latestHeight / 100;
    const bmi = Math.round((latestWeight / (heightM * heightM)) * 10) / 10;
    let category, color;
    if (bmi < 18.5)      { category = t('bmiUnderweight'); color = '#5ac8fa'; }
    else if (bmi < 25)   { category = t('bmiNormal');      color = '#34c759'; }
    else if (bmi < 30)   { category = t('bmiOverweight');  color = '#ff9500'; }
    else                 { category = t('bmiObese');       color = '#ff3b30'; }

    // BMI bar pozisyonu (10-40 arası)
    const pct = Math.min(100, Math.max(0, ((bmi - 10) / 30) * 100));

    bmiCard.innerHTML = `
      <div style="padding:14px 16px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div>
            <div style="font-size:11px;font-weight:600;color:var(--text-secondary);letter-spacing:0.5px;text-transform:uppercase">BMI</div>
            <div style="display:flex;align-items:baseline;gap:6px;margin-top:2px">
              <span style="font-size:28px;font-weight:700;color:${color}">${bmi}</span>
              <span style="font-size:13px;font-weight:600;color:${color}">${category}</span>
            </div>
          </div>
          <div style="text-align:right;font-size:11px;color:var(--text-muted);line-height:1.6">
            <div>${displayWeight(latestWeight)} ${weightUnit}</div>
            <div>${lengthUnit === 'in' ? (() => { const ft = Math.floor(latestHeight/2.54/12); const inch = Math.round(latestHeight/2.54 % 12); return `${ft}'${inch}"`; })() : `${latestHeight} cm`}</div>
          </div>
        </div>
        <div style="height:6px;border-radius:3px;background:linear-gradient(to right,#5ac8fa 0%,#34c759 30%,#ff9500 60%,#ff3b30 100%);position:relative">
          <div style="position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid ${color};box-shadow:0 1px 4px rgba(0,0,0,0.2);left:calc(${pct}% - 6px)"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:10px;color:var(--text-muted)">
          <span>10</span><span>18.5</span><span>25</span><span>30</span><span>40</span>
        </div>
      </div>
    `;
  } else {
    bmiCard.innerHTML = `
      <div style="padding:14px 16px;display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="font-size:11px;font-weight:600;color:var(--text-secondary);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px">BMI</div>
          <div style="font-size:13px;color:var(--text-muted)">${t('bmiSubtitle')}</div>
        </div>
        <span style="font-size:24px">⚖️</span>
      </div>
    `;
  }
  body.appendChild(bmiCard);

  // ── TABS ──
  const tabBar = document.createElement('div');
  tabBar.style.cssText = 'display:flex;gap:4px;padding:12px 16px 0;border-bottom:1px solid var(--border-light);margin-bottom:4px;';

  let activeTab = 'weight';
  const contentWrap = document.createElement('div');

  function makeTab(id, label) {
    const btn = document.createElement('button');
    btn.dataset.tab = id;
    btn.textContent = label;
    btn.style.cssText = `padding:12px 24px;border:none;background:none;cursor:pointer;font-size:15px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--text-secondary);transition:color 0.15s,border-color 0.15s;border-radius:0;flex:1;text-align:center;`;
    btn.onclick = () => {
      activeTab = id;
      tabBar.querySelectorAll('button').forEach(b => {
        const isActive = b.dataset.tab === id;
        b.style.color = isActive ? 'var(--accent)' : 'var(--text-secondary)';
        b.style.borderBottomColor = isActive ? 'var(--accent)' : 'transparent';
      });
      contentWrap.innerHTML = '';
      if (id === 'weight') drawWeightTab();
      else drawBioTab();
    };
    return btn;
  }

  const weightTab = makeTab('weight', t('weightTabLabel'));
  const bioTab = makeTab('bio', t('bioTabLabel'));
  weightTab.style.color = 'var(--accent)';
  weightTab.style.borderBottomColor = 'var(--accent)';
  tabBar.appendChild(weightTab);
  tabBar.appendChild(bioTab);
  body.appendChild(tabBar);
  body.appendChild(contentWrap);
  requestAnimationFrame(() => initTabSwipe(contentWrap, tabBar));
  function drawWeightTab() {
    const log = loadWeightLog();

    const inputRow = document.createElement('div');
    inputRow.style.cssText = 'display:flex;gap:8px;padding:16px;align-items:center';
    inputRow.innerHTML = `
      <style>#weightInput::-webkit-outer-spin-button,#weightInput::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}#weightInput{-moz-appearance:textfield}</style>
      <input id="weightInput" type="number" inputmode="decimal" step="0.1" min="0"
        placeholder="${t('weightPlaceholder')}"
        style="flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:15px;">
      <span style="color:var(--text-secondary);font-size:13px">${weightUnit}</span>
      <button onclick="addWeightEntry()" style="padding:10px 16px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap">${t('addWeight')}</button>
    `;
    contentWrap.appendChild(inputRow);

    if (log.length === 0) {
      const empty = document.createElement('div');
      empty.style.cssText = 'padding:20px;text-align:center;color:var(--text-muted);font-size:13px';
      empty.textContent = t('noWeightData');
      contentWrap.appendChild(empty);
      return;
    }

    const allSorted = [...log].sort((a, b) => a.date.localeCompare(b.date));
    const PT_GAP = 44, H = 130, pad = 20;
    const W = Math.max(300, (allSorted.length - 1) * PT_GAP + pad * 2);
    const maxV = Math.max(...allSorted.map(d => d.kg));
    const minV = Math.min(...allSorted.map(d => d.kg));
    const range = maxV - minV || 1;

    const scrollWrap = document.createElement('div');
    scrollWrap.style.cssText = 'overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0 16px;padding-bottom:4px';

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    if (allSorted.length === 1) {
      // Tek nokta — 100% genişlik, ortalanmış
      svg.setAttribute('viewBox', `0 0 ${W} ${H + 20}`);
      svg.setAttribute('width', '100%');
      svg.setAttribute('height', H + 20);
      svg.style.cssText = 'display:block';
    } else {
      svg.setAttribute('width', W); svg.setAttribute('height', H + 20);
      svg.style.cssText = 'display:block;min-width:100%';
    }

    if (allSorted.length > 1) {
      const points = allSorted.map((d, i) => {
        const x = pad + i * PT_GAP;
        const y = H - ((d.kg - minV) / range) * (H - 20) - 10;
        return `${x},${y}`;
      }).join(' ');
      const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      poly.setAttribute('points', points); poly.setAttribute('fill', 'none');
      poly.setAttribute('stroke', 'var(--accent)'); poly.setAttribute('stroke-width', '2.5');
      poly.setAttribute('stroke-linecap', 'round'); poly.setAttribute('stroke-linejoin', 'round');
      svg.appendChild(poly);
    }
    allSorted.forEach((d, i) => {
      const x = allSorted.length > 1 ? pad + i * PT_GAP : W / 2;
      const y = H - ((d.kg - minV) / range) * (H - 20) - 10;
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', x); circle.setAttribute('cy', y);
      circle.setAttribute('r', 4); circle.setAttribute('fill', 'var(--accent)');
      svg.appendChild(circle);
      const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      lbl.setAttribute('x', x); lbl.setAttribute('y', H + 14);
      lbl.setAttribute('text-anchor', 'middle');
      lbl.setAttribute('font-size', '9'); lbl.setAttribute('fill', 'var(--text-muted)');
      lbl.textContent = d.date.slice(5); svg.appendChild(lbl);
    });
    scrollWrap.appendChild(svg);
    contentWrap.appendChild(scrollWrap);
    requestAnimationFrame(() => { scrollWrap.scrollLeft = scrollWrap.scrollWidth; });

    const listWrap = document.createElement('div');
    listWrap.style.cssText = 'display:flex;flex-direction:column;gap:6px;margin-top:4px;padding:0 16px 16px';
    [...log].sort((a, b) => b.date.localeCompare(a.date)).forEach((entry, i) => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--surface2);border-radius:10px';
      row.innerHTML = `
        <span style="font-size:13px;color:var(--text-secondary)">${entry.date}</span>
        <span style="font-size:15px;font-weight:600;color:var(--text)">${displayWeight(entry.kg)} ${weightUnit}</span>
        <button onclick="deleteWeightEntry(${i})" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:16px;padding:0 4px">✕</button>
      `;
      listWrap.appendChild(row);
    });
    contentWrap.appendChild(listWrap);
  }

  // ── BIO TAB ──
  function drawBioTab() {
    const bioLog = loadBioLog();
    const wrap = document.createElement('div');
    wrap.style.cssText = 'padding:12px 16px calc(80px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;box-sizing:border-box;width:100%;white-space:normal;';

    function cmToFtIn(cm) {
      const totalIn = cm / 2.54;
      const ft = Math.floor(totalIn / 12);
      const inch = Math.round(totalIn % 12);
      return { ft, inch };
    }

    BIO_METRICS.forEach(metric => {
      const entries = bioLog[metric.key] || [];
      const latest = entries.length > 0 ? entries[entries.length - 1] : null;
      const isHeightInInches = metric.key === 'height' && lengthUnit === 'in';

      let latestDisplay = '', latestNum = '', latestUnit = metric.unit();
      if (latest) {
        if (isHeightInInches) {
          const { ft, inch } = cmToFtIn(latest.val);
          latestNum = `${ft}'${inch}"`;
          latestUnit = '';
        } else {
          latestNum = latest.val;
        }
      }

      const card = document.createElement('div');
      card.style.cssText = 'background:var(--surface2);border-radius:12px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px;position:relative;';

      // Sıfırlama butonu — değer varsa göster
      if (latest) {
        const resetBtn = document.createElement('button');
        resetBtn.innerHTML = '✕';
        resetBtn.style.cssText = 'position:absolute;top:8px;right:8px;background:none;border:none;color:var(--text-muted);font-size:12px;cursor:pointer;padding:2px 4px;line-height:1;';
        resetBtn.onclick = () => deleteBioEntry(metric.key);
        card.appendChild(resetBtn);
      }

      // Başlık + değer
      const top = document.createElement('div');
      top.innerHTML = `
        <div style="font-size:11px;color:var(--text-secondary);font-weight:500;margin-bottom:5px">${bioLabel(metric)}</div>
        <div style="display:flex;align-items:baseline;gap:4px">
          ${latest
            ? `<span style="font-size:20px;font-weight:700;color:var(--accent);line-height:1">${latestNum}</span>
               ${latestUnit ? `<span style="font-size:12px;color:var(--text-secondary)">${latestUnit}</span>` : ''}`
            : `<span style="font-size:16px;color:var(--text-muted)">—</span>`
          }
        </div>
      `;
      card.appendChild(top);

      // Input
      const inputWrap = document.createElement('div');
      if (isHeightInInches) {
        const latestFt = latest ? cmToFtIn(latest.val).ft : '';
        const latestIn = latest ? cmToFtIn(latest.val).inch : '';
        inputWrap.style.cssText = 'display:flex;gap:4px;align-items:center';
        inputWrap.innerHTML = `
          <style>#bio-height-ft::-webkit-outer-spin-button,#bio-height-ft::-webkit-inner-spin-button,#bio-height-in::-webkit-outer-spin-button,#bio-height-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}</style>
          <input id="bio-height-ft" type="number" inputmode="numeric" min="0" max="8" placeholder="${latestFt || 'ft'}"
            style="width:38px;padding:7px 6px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;-webkit-appearance:none;-moz-appearance:textfield;text-align:center;box-sizing:border-box">
          <span style="font-size:11px;color:var(--text-secondary)">'</span>
          <input id="bio-height-in" type="number" inputmode="decimal" min="0" max="11.9" step="0.1" placeholder="${latestIn || 'in'}"
            style="width:38px;padding:7px 6px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;-webkit-appearance:none;-moz-appearance:textfield;text-align:center;box-sizing:border-box">
          <span style="font-size:11px;color:var(--text-secondary)">"</span>
          <button onclick="addBioEntryFtIn()" style="flex:1;padding:7px 4px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:11px;font-weight:600;cursor:pointer">${lang === 'tr' ? '✓' : '✓'}</button>
        `;
      } else {
        inputWrap.style.cssText = 'display:flex;gap:5px;align-items:center';
        inputWrap.innerHTML = `
          <style>#bio-${metric.key}::-webkit-outer-spin-button,#bio-${metric.key}::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}</style>
          <input id="bio-${metric.key}" type="number" inputmode="decimal" step="0.1" min="0"
            placeholder="${latest ? latest.val : metric.unit()}"
            style="flex:1;padding:7px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;-webkit-appearance:none;-moz-appearance:textfield;min-width:0;box-sizing:border-box">
          <button onclick="addBioEntry('${metric.key}')" style="padding:7px 8px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap">${lang === 'tr' ? '✓' : '✓'}</button>
        `;
      }
      card.appendChild(inputWrap);

      // Geçmiş — son 2 kayıt
      if (entries.length > 1) {
        const hist = document.createElement('div');
        hist.style.cssText = 'display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--border-light);padding-top:6px;margin-top:2px';
        [...entries].reverse().slice(1, 3).forEach(e => {
          const row = document.createElement('div');
          row.style.cssText = 'display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted)';
          const displayVal = isHeightInInches
            ? (() => { const {ft,inch} = cmToFtIn(e.val); return `${ft}'${inch}"`; })()
            : `${e.val} ${metric.unit()}`;
          row.innerHTML = `<span>${e.date.slice(5)}</span><span>${displayVal}</span>`;
          hist.appendChild(row);
        });
        card.appendChild(hist);
      }

      wrap.appendChild(card);
    });

    contentWrap.appendChild(wrap);
  }

  drawWeightTab();
}

// kg değerini aktif birime göre gösterim için çevir
function displayWeight(kg) {
  if (weightUnit === 'lbs') return Math.round(kg * 2.20462 * 10) / 10;
  return kg;
}

function addWeightEntry() {
  const val = parseFloat(document.getElementById('weightInput')?.value);
  if (!val || val <= 0) return;
  const kg = weightUnit === 'lbs' ? Math.round(val / 2.20462 * 100) / 100 : val;
  const log = loadWeightLog();
  const today = new Date().toISOString().slice(0, 10);
  const existing = log.findIndex(e => e.date === today);
  if (existing >= 0) log[existing].kg = kg;
  else log.push({ date: today, kg });
  saveWeightLog(log);
  refreshWeightPanel('weight');
}

function refreshWeightPanel(keepTab) {
  // Aktif tab'ı tespit et
  const activeTabBtn = document.querySelector('#sidebarBody button[data-tab]');
  const currentTab = keepTab || (activeTabBtn ? [...document.querySelectorAll('#sidebarBody button[data-tab]')].find(b => b.style.color === 'var(--accent)')?.dataset.tab : 'weight') || 'weight';
  const sb = document.getElementById('sidebarBody');
  const scrollTop = sb ? sb.scrollTop : 0;
  renderWeightPanel();
  requestAnimationFrame(() => {
    const btn = document.querySelector(`#sidebarBody button[data-tab="${currentTab}"]`);
    if (btn) btn.click();
    if (sb) sb.scrollTop = scrollTop;
  });
}

function deleteWeightEntry(idx) {
  const log = loadWeightLog();
  const sorted = [...log].sort((a, b) => b.date.localeCompare(a.date));
  const entry = sorted[idx];
  const realIdx = log.findIndex(e => e.date === entry.date && e.kg === entry.kg);
  if (realIdx >= 0) log.splice(realIdx, 1);
  saveWeightLog(log);
  refreshWeightPanel('weight');
}

function deleteBioEntry(metricId) {
  const bioLog = loadBioLog();
  if (bioLog[metricId] && bioLog[metricId].length > 0) {
    bioLog[metricId].pop();
  }
  saveBioLog(bioLog);
  refreshBioTab();
}

function addBioEntry(metricId) {
  const input = document.getElementById(`bio-${metricId}`);
  if (!input) return;
  const val = parseFloat(input.value);
  if (!val || val <= 0) return;
  const bioLog = loadBioLog();
  if (!bioLog[metricId]) bioLog[metricId] = [];
  const today = new Date().toISOString().slice(0, 10);
  const existing = bioLog[metricId].findIndex(e => e.date === today);
  if (existing >= 0) bioLog[metricId][existing].val = val;
  else bioLog[metricId].push({ date: today, val });
  saveBioLog(bioLog);
  input.value = '';
  refreshBioTab();
}

function addBioEntryFtIn() {
  const ft = parseInt(document.getElementById('bio-height-ft')?.value) || 0;
  const inch = parseFloat(document.getElementById('bio-height-in')?.value) || 0;
  if (ft === 0 && inch === 0) return;
  const cm = Math.round(((ft * 12) + inch) * 2.54 * 10) / 10;
  const bioLog = loadBioLog();
  if (!bioLog['height']) bioLog['height'] = [];
  const today = new Date().toISOString().slice(0, 10);
  const existing = bioLog['height'].findIndex(e => e.date === today);
  if (existing >= 0) bioLog['height'][existing].val = cm;
  else bioLog['height'].push({ date: today, val: cm });
  saveBioLog(bioLog);
  refreshBioTab();
}

function refreshBioTab() {
  refreshWeightPanel('bio');
}

// ── DRAG & DROP (exercise reorder) ──
let dragSrcIdx = null;
let _isDragging = false;
const openSetsState = new Set();

// Sürükleme sırasında otomatik scroll
let _autoScrollRAF = null;
function startAutoScroll(clientY) {
  const ZONE = 80, SPEED = 8;
  const vh = window.innerHeight;
  cancelAnimationFrame(_autoScrollRAF);
  function step() {
    if (clientY < ZONE) {
      window.scrollBy(0, -SPEED);
    } else if (clientY > vh - ZONE) {
      window.scrollBy(0, SPEED);
    }
    _autoScrollRAF = requestAnimationFrame(step);
  }
  _autoScrollRAF = requestAnimationFrame(step);
}
function stopAutoScroll() {
  cancelAnimationFrame(_autoScrollRAF);
  _autoScrollRAF = null;
}

function saveOpenSets() {
  openSetsState.clear();
  document.querySelectorAll('.sets-container').forEach(el => {
    if (el.classList.contains('open')) {
      const idx = parseInt(el.id.replace('sets-', ''));
      if (!isNaN(idx)) openSetsState.add(idx);
    }
  });
}

function restoreOpenSets() {
  if (!_isDragging) return;
  _isDragging = false;
  openSetsState.forEach(idx => {
    const el = document.getElementById(`sets-${idx}`);
    if (el) el.classList.add('open');
  });
}

function mergeGroups(exs, groupA, groupB) {
  // groupB'yi groupA'ya dahil et
  exs.forEach(ex => {
    if (ex.ssGroup === groupB) ex.ssGroup = groupA;
  });
}

function wouldSplitGroup(exs, srcIdx, destIdx) {
  // destIdx'e bağımsız bir egzersiz eklendiğinde SS grubunu böler mi?
  const srcGroup = exs[srcIdx]?.ssGroup;
  // Hedef pozisyonun hemen öncesi ve sonrası aynı SS grubundaysa bölünür
  const before = exs[destIdx - 1];
  const after = exs[destIdx];
  if (!before || !after) return false;
  if (!before.ssGroup || !after.ssGroup) return false;
  if (before.ssGroup !== after.ssGroup) return false;
  // Kaynak bu grubun üyesiyse sorun yok
  if (srcGroup && srcGroup === before.ssGroup) return false;
  return true;
}

function getSupersetGroup(exs, idx) {
  return exs[idx]?.ssGroup || null;
}

function getGroupIndices(exs, groupId) {
  if (!groupId) return [];
  return exs.map((ex, i) => ex.ssGroup === groupId ? i : -1).filter(i => i !== -1);
}

function fixSupersetIndices(exs, fromIdx, toIdx) {
  // ssGroup tabanlı sistemde index güncellemeye gerek yok
}

function moveSupersetPair(exs, srcIdx, destIdx) {
  const groupId = getSupersetGroup(exs, srcIdx);
  const groupIdxs = getGroupIndices(exs, groupId).sort((a,b) => a-b);

  // Grup elemanlarını çıkar (büyükten küçüğe)
  const members = [];
  for (let i = groupIdxs.length - 1; i >= 0; i--) {
    members.unshift(exs.splice(groupIdxs[i], 1)[0]);
  }

  // Hedef index'i güncelle
  let insertAt = destIdx;
  for (const gi of groupIdxs) {
    if (gi < destIdx) insertAt--;
  }
  insertAt = Math.max(0, Math.min(insertAt, exs.length));

  // Grubu yeni konuma ekle
  exs.splice(insertAt, 0, ...members);
}

function initDragDrop(cardEl, ei) {
  cardEl.setAttribute('draggable', 'true');
  cardEl.style.cursor = 'grab';

  cardEl.addEventListener('dragstart', e => {
    dragSrcIdx = ei;
    _isDragging = true;
    saveOpenSets();
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => cardEl.style.opacity = '0.5', 0);
  });
  cardEl.addEventListener('dragend', () => {
    cardEl.style.opacity = '';
    stopAutoScroll();
    document.querySelectorAll('.workout-card').forEach(c => c.classList.remove('drag-over'));
  });
  cardEl.addEventListener('dragover', e => {
    e.preventDefault();
    startAutoScroll(e.clientY);
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.workout-card').forEach(c => c.classList.remove('drag-over'));
    cardEl.classList.add('drag-over');
  });
  cardEl.addEventListener('dragleave', () => cardEl.classList.remove('drag-over'));
  cardEl.addEventListener('drop', e => {
    e.preventDefault();
    cardEl.classList.remove('drag-over');
    if (dragSrcIdx === null || dragSrcIdx === ei) return;
    const exs = state.days[activeDay].exercises;
    const groupId = getSupersetGroup(exs, dragSrcIdx);
    const targetGroupId = getSupersetGroup(exs, ei);

    if (groupId && groupId === targetGroupId) {
      // SS içi yer değiştirme
      const [moved] = exs.splice(dragSrcIdx, 1);
      const insertAt = Math.max(0, Math.min(ei > dragSrcIdx ? ei : ei, exs.length));
      exs.splice(insertAt, 0, moved);
    } else if (groupId && targetGroupId && groupId !== targetGroupId) {
      // Farklı iki SS grubu → birleştir
      mergeGroups(exs, targetGroupId, groupId);
      moveSupersetPair(exs, dragSrcIdx, ei);
    } else if (groupId) {
      // SS grubunu normal yere taşı
      moveSupersetPair(exs, dragSrcIdx, ei);
    } else if (!groupId && targetGroupId) {
      // Bağımsız egzersiz SS grubundaki bir karta bırakıldı
      // Grubun ilk ve son index'ini bul
      let firstGroupIdx = ei, lastGroupIdx = ei;
      for (let i = ei - 1; i >= 0; i--) {
        if (exs[i].ssGroup === targetGroupId) firstGroupIdx = i; else break;
      }
      for (let i = ei + 1; i < exs.length; i++) {
        if (exs[i].ssGroup === targetGroupId) lastGroupIdx = i; else break;
      }
      // Sürükleme yukarıdan mı aşağıdan mı?
      const [moved] = exs.splice(dragSrcIdx, 1);
      // dragSrcIdx'i çıkardıktan sonra indeksleri güncelle
      const adjFirst = dragSrcIdx < firstGroupIdx ? firstGroupIdx - 1 : firstGroupIdx;
      const adjLast  = dragSrcIdx < lastGroupIdx  ? lastGroupIdx  - 1 : lastGroupIdx;
      // Kaynaktan hedefe yöne göre: üstten geliyorsa grubun üstüne, alttan geliyorsa altına
      const insertAt = dragSrcIdx < ei
        ? adjLast + 1   // aşağıdan geldi → grubun altına
        : adjFirst;     // yukarıdan geldi → grubun üstüne
      exs.splice(Math.max(0, Math.min(insertAt, exs.length)), 0, moved);
      fixSupersetIndices(exs, dragSrcIdx, insertAt);
    } else {
      // Normal taşı
      const [moved] = exs.splice(dragSrcIdx, 1);
      const insertAt = Math.max(0, Math.min(ei > dragSrcIdx ? ei : ei, exs.length));
      exs.splice(insertAt, 0, moved);
      fixSupersetIndices(exs, dragSrcIdx, insertAt);
    }

    dragSrcIdx = null;
    saveState();
    render();
  });

  // Touch drag (mobile) — long press to activate, card follows finger
  let touchStartY = 0, touchStartX = 0, touchSrcIdx = null, longPressTimer = null, dragActive = false;
  let ghost = null, placeholder = null;

  function createGhost() {
    const rect = cardEl.getBoundingClientRect();
    ghost = cardEl.cloneNode(true);
    ghost.style.cssText = `position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;opacity:0.85;pointer-events:none;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,0.25);transform:scale(1.03);transition:none;border-radius:var(--radius);`;
    document.body.appendChild(ghost);
    placeholder = document.createElement('div');
    placeholder.style.cssText = `height:${rect.height}px;margin-bottom:10px;border-radius:var(--radius);background:var(--surface2);border:2px dashed var(--accent);box-sizing:border-box;`;
    cardEl.parentNode.insertBefore(placeholder, cardEl);
    cardEl.style.opacity = '0';
  }

  function removeGhost() {
    if (ghost) { ghost.remove(); ghost = null; }
    if (placeholder) { placeholder.remove(); placeholder = null; }
    cardEl.style.opacity = '';
    cardEl.style.transform = '';
  }

  function getCardAtY(y) {
    const cards = [...document.querySelectorAll('.workout-card')].filter(c => c !== cardEl);
    for (const c of cards) {
      const r = c.getBoundingClientRect();
      if (y >= r.top && y <= r.bottom) return c;
    }
    return null;
  }

  cardEl.addEventListener('touchstart', e => {
    touchStartY = e.touches[0].clientY;
    touchStartX = e.touches[0].clientX;
    touchSrcIdx = ei;
    dragActive = false;
    longPressTimer = setTimeout(() => {
      dragActive = true;
      _isDragging = true;
      saveOpenSets();
      createGhost();
    }, 500);
  }, { passive: true });

  cardEl.addEventListener('touchmove', e => {
    const dy = Math.abs(e.touches[0].clientY - touchStartY);
    const dx = Math.abs(e.touches[0].clientX - touchStartX);
    if (!dragActive) {
      if (dy > 8 || dx > 8) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
        touchSrcIdx = null;
      }
      return;
    }
    e.preventDefault();
    const touch = e.touches[0];
    const rect = ghost.getBoundingClientRect();
    ghost.style.top = (touch.clientY - rect.height / 2) + 'px';
    startAutoScroll(touch.clientY);

    // Move placeholder to indicate drop position
    const target = getCardAtY(touch.clientY);
    if (target && target !== placeholder) {
      const targetRect = target.getBoundingClientRect();
      if (touch.clientY < targetRect.top + targetRect.height / 2) {
        target.parentNode.insertBefore(placeholder, target);
      } else {
        target.parentNode.insertBefore(placeholder, target.nextSibling);
      }
    }
  }, { passive: false });

  cardEl.addEventListener('touchend', e => {
    clearTimeout(longPressTimer);
    longPressTimer = null;
    stopAutoScroll();
    if (!dragActive || touchSrcIdx === null) {
      removeGhost();
      dragActive = false; touchSrcIdx = null; return;
    }
    if (placeholder) {
      const allCards = [...document.querySelectorAll('.workout-card')];
      const siblings = [...placeholder.parentNode.children];
      let newIdx = 0, count = 0;
      for (const el of siblings) {
        if (el === placeholder) { newIdx = count; break; }
        if (allCards.includes(el) && el !== cardEl) count++;
      }
      const exs = state.days[activeDay].exercises;
      const groupId = getSupersetGroup(exs, touchSrcIdx);
      const targetGroupId = newIdx < exs.length ? getSupersetGroup(exs, newIdx) : null;

      if (newIdx !== touchSrcIdx) {
        if (groupId && groupId === targetGroupId) {
          const [moved] = exs.splice(touchSrcIdx, 1);
          const insertAt = Math.max(0, Math.min(newIdx, exs.length));
          exs.splice(insertAt, 0, moved);
        } else if (groupId && targetGroupId && groupId !== targetGroupId) {
          mergeGroups(exs, targetGroupId, groupId);
          moveSupersetPair(exs, touchSrcIdx, newIdx);
        } else if (groupId) {
          moveSupersetPair(exs, touchSrcIdx, newIdx);
        } else if (!groupId && targetGroupId) {
          let firstGroupIdx = newIdx, lastGroupIdx = newIdx;
          for (let i = newIdx - 1; i >= 0; i--) {
            if (exs[i].ssGroup === targetGroupId) firstGroupIdx = i; else break;
          }
          for (let i = newIdx + 1; i < exs.length; i++) {
            if (exs[i].ssGroup === targetGroupId) lastGroupIdx = i; else break;
          }
          const [moved] = exs.splice(touchSrcIdx, 1);
          const adjFirst = touchSrcIdx < firstGroupIdx ? firstGroupIdx - 1 : firstGroupIdx;
          const adjLast  = touchSrcIdx < lastGroupIdx  ? lastGroupIdx  - 1 : lastGroupIdx;
          const insertAt = touchSrcIdx < newIdx
            ? adjLast + 1
            : adjFirst;
          exs.splice(Math.max(0, Math.min(insertAt, exs.length)), 0, moved);
          fixSupersetIndices(exs, touchSrcIdx, insertAt);
        } else {
          const [moved] = exs.splice(touchSrcIdx, 1);
          const insertAt = Math.max(0, Math.min(newIdx, exs.length));
          exs.splice(insertAt, 0, moved);
          fixSupersetIndices(exs, touchSrcIdx, insertAt);
        }
        saveState();
      }
    }
    removeGhost();
    dragActive = false; touchSrcIdx = null;
    render();
  }, { passive: true });
}

// ── RENDER ──
function render() {
  // Hafta değişmişse session'ı temizle
  const currentKey = getCurrentWeekKey();
  if (currentKey !== _sessionWeekKey) {
    saveCurrentWeekToHistory();
    sessionSets = {};

    saveSession();
    carryOverLastWeek();
  }
  renderTabs();
  renderContent();

  updateTimerBar();
  updateMainScroll();

// ── SCROLL LOCK ──
let _scrollLocked = false;
function _preventScroll(e) {
  const allowed = e.target.closest('#sidebarBody, .modal, .settings-sheet, .day-tabs');
  if (allowed) {
    // Scroll sınırına ulaşıldıysa preventDefault — ortada ise serbest bırak
    const el = allowed;
    const atTop = el.scrollTop <= 0;
    const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 1;
    const touch = e.touches[0];
    // İlk touch'u kaydet
    if (!el._touchStartY) el._touchStartY = touch.clientY;
    const dy = touch.clientY - el._touchStartY;
    if ((atTop && dy > 0) || (atBottom && dy < 0)) {
      e.preventDefault();
    }
  } else {
    e.preventDefault();
  }
}

function _preventScrollEnd(e) {
  const allowed = e.target.closest('#sidebarBody, .modal, .settings-sheet, .day-tabs');
  if (allowed) delete allowed._touchStartY;
}
function lockScroll() {
  if (_scrollLocked) return;
  _scrollLocked = true;
  document.addEventListener('touchmove', _preventScroll, { passive: false });
  document.addEventListener('touchend', _preventScrollEnd, { passive: true });
}
function unlockScroll() {
  if (!_scrollLocked) return;
  _scrollLocked = false;
  document.removeEventListener('touchmove', _preventScroll);
  document.removeEventListener('touchend', _preventScrollEnd);
}

function updateMainScroll() {
  if (window.innerWidth > 600) return;
  if (activePanel) return;
  const exercises = (viewingWeek
    ? (history[viewingWeek] || state).days[activeDay].exercises
    : state.days[activeDay].exercises) || [];
  if (exercises.length === 0) {
    lockScroll();
    window.scrollTo(0, 0);
    const main = document.querySelector('.main');
    if (main) main.scrollTop = 0;
  } else {
    unlockScroll();
  }
}

function updateTimerBar() {
  const today = getTodayIndex();
  const isPastDay = !viewingWeek && activeDay !== today;
  const isReadonly = viewingWeek !== null;
  const isPast = isPastDay || isReadonly;

  const timerBar = document.getElementById('timerBar');
  const timerBtn = document.getElementById('timerBtn');
  const timerDisplay = document.getElementById('timerDisplay');
  const timerLabel = document.getElementById('timerLabel');
  const viewSummaryBtn = document.getElementById('viewSummaryBtn');
  const newWorkoutBtn = document.getElementById('newWorkoutBtn');

  if (isPast) {
    // Past day or readonly week — only show "View Summary" centered
    timerBtn.style.display = 'none';
    timerDisplay.style.display = 'none';
    timerLabel.style.display = 'none';
    newWorkoutBtn.style.display = 'none';
    timerBar.style.justifyContent = 'center';
    viewSummaryBtn.style.display = 'block';
    viewSummaryBtn.style.marginLeft = '0';
  } else {
    // Today — restore based on current workout state
    timerBar.style.justifyContent = '';
    viewSummaryBtn.style.marginLeft = '0';
    if (workoutActive) {
      // Currently running
      timerBtn.style.display = '';
      timerDisplay.style.display = '';
      timerLabel.style.display = 'none';
      newWorkoutBtn.style.display = 'none';
      viewSummaryBtn.style.display = 'none';
      const pb = document.getElementById('pauseBtn');
      if (pb) { pb.style.display = 'flex'; if (!workoutPaused) pb.classList.remove('paused'); }
    } else if (workoutElapsedOnStop > 0) {
      // Stopped, has a previous session
      timerBtn.style.display = 'none';
      timerDisplay.style.display = 'none';
      timerLabel.style.display = 'none';
      newWorkoutBtn.style.display = 'block';
      viewSummaryBtn.style.display = 'block';
    } else {
      // Never started or reset
      timerBtn.style.display = '';
      timerDisplay.style.display = '';
      timerLabel.style.display = '';
      newWorkoutBtn.style.display = 'none';
      viewSummaryBtn.style.display = 'none';
    }
  }
}

function renderTabs() {
  const container = document.getElementById('dayTabs');
  container.innerHTML = '';
  const days = viewingWeek ? (history[viewingWeek]?.days || state.days) : state.days;
  I18N[lang].days.forEach((_, i) => {
    const day = days[i];
    const btn = document.createElement('button');
    const today = getTodayIndex();
    btn.className = 'day-tab' + (i === activeDay ? ' active' : '') + (i === today ? ' has-program' : '');
    btn.textContent = getDayName(day, i);
    btn.onclick = () => { activeDay = i; render(); requestAnimationFrame(() => scrollTabToCenter(i)); };

    // Uzun basma — gün kopyalama (sadece düzenleme modunda)
    if (!viewingWeek) {
      let pressTimer = null;
      btn.addEventListener('touchstart', () => {
        pressTimer = setTimeout(() => { openCopyDayModal(i); }, 600);
      }, { passive: true });
      btn.addEventListener('touchend', () => clearTimeout(pressTimer), { passive: true });
      btn.addEventListener('touchmove', () => clearTimeout(pressTimer), { passive: true });
      btn.addEventListener('mousedown', () => {
        pressTimer = setTimeout(() => { openCopyDayModal(i); }, 600);
      });
      btn.addEventListener('mouseup', () => clearTimeout(pressTimer));
      btn.addEventListener('mouseleave', () => clearTimeout(pressTimer));
    }

    container.appendChild(btn);
  });
  container.addEventListener('scroll', updateArrows, { passive: true });
  setTimeout(() => { updateArrows(); scrollTabToCenter(activeDay); }, 50);
}

let copyDaySrcIdx = null;

function openCopyDayModal(srcIdx) {
  copyDaySrcIdx = srcIdx;
  const srcName = getDayName(state.days[srcIdx], srcIdx);
  const title = document.getElementById('copyDayTitle');
  title.textContent = t('copyDayTitle', srcName);

  const btns = document.getElementById('copyDayBtns');
  btns.innerHTML = '';

  I18N[lang].days.forEach((_, i) => {
    if (i === srcIdx) return;
    const dayName = getDayName(state.days[i], i);

    const btn = document.createElement('button');
    btn.style.cssText = `width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:space-between;`;
    btn.innerHTML = `<span>${dayName}</span>${hasExercises ? `<span style="font-size:11px;color:var(--text-muted)">${t('exercisesCount', state.days[i].exercises.length)}</span>` : ''}`;
    btn.onclick = () => confirmCopyDay(i, hasExercises);
    btns.appendChild(btn);
  });

  document.getElementById('copyDayOverlay').classList.add('open');

}

function confirmCopyDay(destIdx, hasExercises) {
  if (hasExercises) {
    const destName = getDayName(state.days[destIdx], destIdx);
    const msg = t('copyDayHasExercises', destName);

    // Mini seçim modalı — mevcut modal içine inject et
    const btns = document.getElementById('copyDayBtns');
    btns.innerHTML = `
      <p style="font-size:13px;color:var(--text-secondary);margin:0 0 12px">${msg}</p>
      <button onclick="doCopyDay(${destIdx},'replace')" style="width:100%;padding:13px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px">${t('replaceDay')}</button>
      <button onclick="doCopyDay(${destIdx},'append')" style="width:100%;padding:13px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;font-weight:500;cursor:pointer">${t('appendDay')}</button>
    `;
  } else {
    doCopyDay(destIdx, 'replace');
  }
}

function doCopyDay(destIdx, mode) {
  const src = state.days[copyDaySrcIdx];
  const dest = state.days[destIdx];
  const copied = JSON.parse(JSON.stringify(src.exercises));
  if (mode === 'replace') {
    dest.exercises = copied;
  } else {
    dest.exercises = [...dest.exercises, ...copied];
  }
  saveState();
  closeCopyDayModal();
  const destName = getDayName(state.days[destIdx], destIdx);
  showFlash(t('copiedTo', destName));
  render();
}

function closeCopyDayModal() {
  document.getElementById('copyDayOverlay').classList.remove('open');
  document.body.style.overflow = '';
  copyDaySrcIdx = null;
}

function renderDayNote(isReadonly) {
  const wrap = document.getElementById('dayNoteWrap');
  if (!wrap) return;
  if (!state.dayNotes) state.dayNotes = Array(7).fill('');
  const notes = isReadonly ? (history[viewingWeek]?.dayNotes || state.dayNotes) : state.dayNotes;

  wrap.innerHTML = '';
  if (isReadonly) {
    if (note) {

  }
  const tag = document.createElement('div');
  tag.className = note ? 'day-note-tag filled' : 'day-note-tag empty';
  tag.textContent = note || t('addNote');
  tag.onclick = () => openDayNoteEdit(note);
  wrap.appendChild(tag);
}

function openDayNoteEdit(current) {
  const wrap = document.getElementById('dayNoteWrap');
  wrap.innerHTML = '';
  const input = document.createElement('input');
  input.className = 'day-note-input';
  input.type = 'text';
  input.maxLength = 30;
  input.placeholder = t('addNotePlaceholder');
  input.value = current || '';
  input.onblur = () => saveDayNote(input.value.trim());
  input.onkeydown = e => {
    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { input.onblur = null; renderDayNote(false); }
  };
  wrap.appendChild(input);
  input.focus();
}

function saveDayNote(val) {
  if (!state.dayNotes) state.dayNotes = Array(7).fill('');
  state.dayNotes[activeDay] = val;
  saveState();
  renderDayNote(false);
}

function renderContent() {
  const isReadonly = viewingWeek !== null;
  const weekData = isReadonly ? history[viewingWeek] : null;
  const days = isReadonly ? (weekData?.days || state.days) : state.days;
  const sets = isReadonly ? (weekData?.sets || {}) : sessionSets;

  const day = days[activeDay];
  const content = document.getElementById('content');
  const progressWrap = document.getElementById('progressWrap');
  const headerSub = document.getElementById('header-sub');
  const headerTitle = document.getElementById('header-title');

  if (isReadonly) {
    headerTitle.textContent = getDayName(day, activeDay);
    headerSub.textContent = weekLabel(viewingWeek);
  } else {
    headerTitle.textContent = getDayName(day, activeDay);
    const today = getTodayIndex();
    if (activeDay === today) {
      const hour = new Date().getHours();
      const greeting = hour < 12 ? t('greetingMorning') : hour < 18 ? t('greetingAfternoon') : t('greetingEvening');
      headerSub.textContent = `${greeting} 💪`;
    } else {
      headerSub.textContent = I18N[lang].days[activeDay];
    }
  }
  renderDayNote(isReadonly);

  if (!day || day.exercises.length === 0) {
    progressWrap.style.display = 'none';
    content.innerHTML = `<div class="empty-state empty-state-animate"><div class="emoji">🗓️</div><p>${t('noProgramToday')}</p></div>`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const es = content.querySelector('.empty-state-animate');
      if (es) es.classList.add('visible');
    }));
    renderAddButton(!isReadonly);
    return;
  }

  // Progress
  let totalSets = 0, doneSets = 0;
  day.exercises.forEach((ex, ei) => {
    totalSets += ex.sets;
    for (let s = 0; s < ex.sets; s++) {
      if (sets[`${activeDay}-${ei}-${s}`]?.done) doneSets++;
    }
  });
  const pct = totalSets > 0 ? Math.round(doneSets / totalSets * 100) : 0;
  progressWrap.style.display = 'block';
  document.getElementById('progressLabel').textContent = t('setsCompleted', doneSets, totalSets);
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';

  content.innerHTML = '';

  day.exercises.forEach((ex, ei) => {
    // Superset grup kontrolü
    const ssGroup = ex.ssGroup || null;
    const hasSS = !!ssGroup;

    const ownSetsDone = Array.from({length: ex.sets}, (_, s) => sets[`${activeDay}-${ei}-${s}`]?.done).every(Boolean);
    let partnerSetsDone = true;
    if (hasSS) {
      day.exercises.forEach((e2, i2) => {
        if (i2 !== ei && e2.ssGroup === ssGroup) {
          const done = Array.from({length: e2.sets}, (_, s) => sets[`${activeDay}-${i2}-${s}`]?.done).every(Boolean);
          if (!done) partnerSetsDone = false;
        }
      });
    }
    const allSetsDone = ownSetsDone && partnerSetsDone;

    const card = document.createElement('div');
    card.className = 'workout-card' + (allSetsDone ? ' completed' : '');
    card.id = `card-${ei}`;
    if (hasSS) card.style.borderLeft = `3px solid var(--accent)`;
    const doneCount = Array.from({length: ex.sets}, (_, s) => sets[`${activeDay}-${ei}-${s}`]?.done ? 1 : 0).reduce((a,b)=>a+b,0);

    if (isReadonly) {
      // History view — read-only
      const setRows = Array.from({length: ex.sets}, (_, s) => {
        const key = `${activeDay}-${ei}-${s}`;
        const sd = sets[key];
        const done = sd?.done;
        const kg = sd?.kg ?? ex.lastKg?.[s];
        const reps = sd?.reps ?? ex.lastReps?.[s];
        return `
          <div class="hist-set-row">
            <span class="set-label">${t('setLabel', s+1)}</span>
            ${done
              ? `<span class="hist-set-done">✓</span>
                 <span class="hist-val">${sd.kg || 0} ${weightUnit} × ${sd.reps || 0} ${t('repsUnit')}</span>`
              : kg !== undefined
                ? `<span class="hist-set-skip">–</span>
                   <span class="hist-val" style="opacity:0.55">${kg} ${weightUnit} × ${reps || ex.reps} ${t('repsUnit')}</span>`
                : `<span class="hist-set-skip">–</span>
                   <span class="hist-val" style="opacity:0.4">${t('notCompleted')}</span>`
            }
          </div>`;
      }).join('');
      card.innerHTML = `
        <div class="workout-card-header" onclick="toggleSets(${ei})">
          <div class="exercise-icon-btn" style="cursor:default">✏️</div>
          <div style="flex:1">
            <div class="exercise-name">${ex.name}</div>
            <div class="exercise-meta">${t('histDone', doneCount, ex.sets)}</div>
          </div>
          <div class="exercise-check">${allSetsDone ? '✓' : ''}</div>
        </div>
        <div class="sets-container open" id="sets-${ei}">${setRows}</div>
      `;
    } else {
      // Live view
      const setRows = Array.from({length: ex.sets}, (_, s) => {
        const key = `${activeDay}-${ei}-${s}`;
        const setData = sets[key] || {};
        const done = setData.done || false;
        const lastKg = ex.lastKg?.[s] ?? '';
        const lastReps = ex.lastReps?.[s] ?? '';
        const savedKg = setData?.kg !== undefined ? setData.kg : '';
        const savedReps = setData?.reps !== undefined ? setData.reps : '';
        return `
          <div class="set-row ${done ? 'set-done' : ''}" id="setrow-${ei}-${s}">
            <span class="set-label">${t('setLabel', s+1)}</span>
            <div class="set-input-group">
              <input class="set-input" type="number" inputmode="decimal" id="kg-${ei}-${s}" placeholder="${savedKg === '' ? lastKg : ''}" value="${savedKg}" min="0" step="2.5" ${done ? 'disabled' : ''}>
              <span class="set-input-label weight-unit-label">${weightUnit}</span>
              <input class="set-input" type="text" inputmode="numeric" id="reps-${ei}-${s}" placeholder="${savedReps === '' ? lastReps : ''}" value="${savedReps}" ${done ? 'disabled' : ''}>
              <span class="set-input-label">${t('repsUnit')}</span>
            </div>
            <button class="btn-set-done ${done ? 'done' : ''}" onclick="completeSet(${ei},${s})" id="setbtn-${ei}-${s}">
              ${done ? '✓' : ''}
            </button>
          </div>`;
      }).join('');
      card.innerHTML = `
        <div class="workout-card-header" onclick="toggleSets(${ei})" style="cursor:pointer">
          <button class="exercise-icon-btn" onclick="event.stopPropagation();openEditExerciseModal(${ei})" title="${t('editTitle')}">✏️</button>
          <div style="flex:1">
            <div class="exercise-name">${ex.name}</div>
            <div class="exercise-meta">${ex.sets} × ${ex.reps} ${t('repsUnit')}${doneCount > 0 ? ` · ${t('doneBadge', doneCount, ex.sets)}` : ''}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <button class="btn-delete-ex" onclick="event.stopPropagation();deleteExerciseLive(${ei})" title="${t('deleteTitle')}">✕</button>
            <div class="exercise-check" ${allSetsDone ? `onclick="event.stopPropagation();resetExercise(${ei})" style="cursor:pointer" title="${t('resetTitle')}"` : ''} >${allSetsDone ? '✓' : ''}</div>
          </div>
        </div>
        <div class="sets-container ${_isDragging ? (openSetsState.has(ei) ? 'open' : '') : (!allSetsDone ? 'open' : '')}" id="sets-${ei}">
          ${setRows}
          ${ex.note ? `<div class="exercise-note">📋 ${ex.note}</div>` : ''}
        </div>
      `;
    }
    if (!isReadonly) initDragDrop(card, ei);
    content.appendChild(card);

    // SS bağlantı çizgisi — bir sonraki egzersiz aynı gruptaysa göster
    const nextEx = day.exercises[ei + 1];
    if (hasSS && nextEx && nextEx.ssGroup === ssGroup) {
      const connector = document.createElement('div');
      connector.id = `ss-connector-${ei}`;
      connector.style.cssText = `display:flex;align-items:center;gap:8px;margin:-4px 0;padding:0 16px;`;
      connector.innerHTML = `
        <div style="width:2px;height:24px;background:var(--accent);border-radius:1px;margin-left:18px;opacity:0.6"></div>
        <span style="font-size:10px;font-weight:800;color:var(--accent);letter-spacing:0.5px;background:var(--accent-soft);padding:2px 7px;border-radius:6px;">SUPERSET</span>
        <div style="flex:1;height:2px;background:var(--accent);opacity:0.2;border-radius:1px"></div>
      `;
      content.appendChild(connector);
    }
  });

  // En üste ve en alta bırakma desteği
  if (!isReadonly) {
    content.addEventListener('dragover', e => { e.preventDefault(); });
    content.addEventListener('drop', e => {
      e.preventDefault();
      if (dragSrcIdx === null) return;
      const exs = state.days[activeDay].exercises;
      if (e.target.closest('.workout-card')) return;
      const groupId = getSupersetGroup(exs, dragSrcIdx);

      // Parmağın content içindeki Y pozisyonuna göre üst/alt karar ver
      const contentRect = content.getBoundingClientRect();
      const firstCard = content.querySelector('.workout-card');
      const firstCardTop = firstCard ? firstCard.getBoundingClientRect().top : contentRect.bottom;
      const isTopZone = e.clientY < firstCardTop;

      if (isTopZone) {
        // En üste taşı
        if (groupId) {
          moveSupersetPair(exs, dragSrcIdx, 0);
        } else {
          const [moved] = exs.splice(dragSrcIdx, 1);
          exs.unshift(moved);
          fixSupersetIndices(exs, dragSrcIdx, 0);
        }
      } else {
        // En alta taşı
        if (groupId) {
          moveSupersetPair(exs, dragSrcIdx, exs.length);
        } else {
          const [moved] = exs.splice(dragSrcIdx, 1);
          exs.push(moved);
          fixSupersetIndices(exs, dragSrcIdx, exs.length - 1);
        }
      }
      dragSrcIdx = null;
      saveState();
      render();
    });
  }

  renderAddButton(!isReadonly);
  // Birim etiketlerini güncelle
  document.querySelectorAll('.weight-unit-label').forEach(el => el.textContent = weightUnit);
}

function deleteExerciseLive(ei) {
  const card = document.getElementById(`card-${ei}`);
  if (!card) return;

  const isLast = state.days[activeDay].exercises.length === 1;

  if (isLast) {
    const exs = state.days[activeDay].exercises;
    const ssGroup = exs[ei]?.ssGroup;
    exs.splice(ei, 1);
    if (ssGroup) {
      const remaining = exs.filter(e => e.ssGroup === ssGroup);
      if (remaining.length <= 1) remaining.forEach(e => { e.ssGroup = null; });
    }
    const newSets = {};
    Object.entries(sessionSets).forEach(([key, val]) => {
      const parts = key.split('-');
      const day = parseInt(parts[0]), ex = parseInt(parts[1]), set = parseInt(parts[2]);
      if (day !== activeDay) { newSets[key] = val; return; }
      if (ex < ei) { newSets[key] = val; }
      else if (ex > ei) { newSets[`${day}-${ex-1}-${set}`] = val; }
    });
    sessionSets = newSets;
    saveState();
    saveCurrentWeekToHistory();
    render();
    const main = document.querySelector('.main');
    if (main) main.scrollTop = 0;
    window.scrollTo(0, 0);
    return;
  }

  // SS connector'ları hemen kaldır (bu kartın altındaki ve üstündeki)
  const connectorAfter = document.getElementById(`ss-connector-${ei}`);
  if (connectorAfter) connectorAfter.remove();
  const connectorBefore = document.getElementById(`ss-connector-${ei - 1}`);
  if (connectorBefore) connectorBefore.remove();
  // Komşu kartların border'larını temizle (geçici — render düzeltir)
  const prevCard = document.getElementById(`card-${ei - 1}`);
  const nextCard = document.getElementById(`card-${ei + 1}`);
  if (prevCard) prevCard.style.borderLeft = '';
  if (nextCard) nextCard.style.borderLeft = '';

  card.style.pointerEvents = 'none';
  card.style.animation = 'blurOutFade 0.35s ease forwards';

  setTimeout(() => {
    card.style.transition = 'none';
    card.style.maxHeight = '0';
    card.style.marginBottom = '0';
    card.style.overflow = 'hidden';
    card.style.padding = '0';
  }, 350);

  setTimeout(() => {
    const exs = state.days[activeDay].exercises;

    // Silinen egzersizin grup üyelerini kontrol et
    const ssGroup = exs[ei]?.ssGroup;
    exs.splice(ei, 1);

    // Grup artık tek üyeyse ssGroup'u temizle
    if (ssGroup) {
      const remaining = exs.filter(e => e.ssGroup === ssGroup);
      if (remaining.length <= 1) {
        remaining.forEach(e => { e.ssGroup = null; });
      }
    }

    const newSets = {};
    Object.entries(sessionSets).forEach(([key, val]) => {
      const parts = key.split('-');
      const day = parseInt(parts[0]), ex = parseInt(parts[1]), set = parseInt(parts[2]);
      if (day !== activeDay) { newSets[key] = val; return; }
      if (ex < ei) { newSets[key] = val; }
      else if (ex > ei) { newSets[`${day}-${ex-1}-${set}`] = val; }
    });
    sessionSets = newSets;
    saveState();
    saveCurrentWeekToHistory();
    render();
  }, 620);
}

function toggleSets(ei) {
  const container = document.getElementById(`sets-${ei}`);
  container.classList.toggle('open');
}

function resetExercise(ei) {
  if (viewingWeek !== null) return;
  const ex = state.days[activeDay].exercises[ei];
  for (let s = 0; s < ex.sets; s++) {
    const key = `${activeDay}-${ei}-${s}`;
    if (sessionSets[key]) sessionSets[key].done = false;
  }
  saveCurrentWeekToHistory();
  render();
  requestAnimationFrame(() => {
    const container = document.getElementById(`sets-${ei}`);
    if (container) container.classList.add('open');
  });
}

function preserveInputValues(ei) {
  const ex = state.days[activeDay].exercises[ei];
  for (let s = 0; s < ex.sets; s++) {
    const key = `${activeDay}-${ei}-${s}`;
    if (sessionSets[key]?.done) continue; // already saved
    const kgEl = document.getElementById(`kg-${ei}-${s}`);
    const repsEl = document.getElementById(`reps-${ei}-${s}`);
    if (!kgEl && !repsEl) continue;
    const kgVal = kgEl?.value.trim() ?? '';
    const repsVal = repsEl?.value.trim() ?? '';
    if (kgVal !== '' || repsVal !== '') {
      sessionSets[key] = { kg: kgVal !== '' ? parseFloat(kgVal) : undefined, reps: repsVal !== '' ? repsVal : undefined, done: false };
    }
  }
  saveSession();
}

function completeSet(ei, si) {
  if (viewingWeek !== null) return;
  const key = `${activeDay}-${ei}-${si}`;
  const ex = state.days[activeDay].exercises[ei];

  if (sessionSets[key]?.done) {
    sessionSets[key].done = false;
    saveCurrentWeekToHistory();
    render();
    const container = document.getElementById(`sets-${ei}`);
    if (container) container.classList.add('open');
    return;
  }

  const kgEl = document.getElementById(`kg-${ei}-${si}`);
  const repsEl = document.getElementById(`reps-${ei}-${si}`);
  const kgVal = kgEl.value.trim();
  const repsVal = repsEl.value.trim();
  const kg = kgVal !== '' ? parseFloat(kgVal) : (parseFloat(kgEl.placeholder) || 0);
  const reps = repsVal !== '' ? repsVal : (repsEl.placeholder || '0');

  sessionSets[key] = { kg, reps, done: true };

  if (!ex.lastKg) ex.lastKg = [];
  if (!ex.lastReps) ex.lastReps = [];
  ex.lastKg[si] = kg;
  ex.lastReps[si] = reps;
  saveState();
  saveCurrentWeekToHistory();

  const allSetsDone = Array.from({length: ex.sets}, (_, s) => sessionSets[`${activeDay}-${ei}-${s}`]?.done).every(Boolean);

  if (allSetsDone) {
    const ssGroup = ex.ssGroup || null;
    if (ssGroup) {
      const allGroupDone = state.days[activeDay].exercises.every((e, i) => {
        if (e.ssGroup !== ssGroup) return true;
        return Array.from({length: e.sets}, (_, s) => sessionSets[`${activeDay}-${i}-${s}`]?.done).every(Boolean);
      });
      if (allGroupDone) showFlash(t('supersetDone'));
    } else {
      showFlash(t('exerciseDone', ex.name));
    }
  }

  // Tüm egzersizlerin input değerlerini kaydet
  state.days[activeDay].exercises.forEach((_, i) => preserveInputValues(i));
  render();
  const container = document.getElementById(`sets-${ei}`);
  if (container && !allSetsDone) container.classList.add('open');
}

function showFlash(msg) {
  const el = document.getElementById('flash');
  el.textContent = msg;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1900);
}

let _editSupersetOn = false;
function toggleSupersetEdit() {
  const ex = state.days[activeDay].exercises[editingExerciseIdx];
  _editSupersetOn = !ex.ssGroup;
  const tog = document.getElementById('editSupersetToggle');
  const thumb = document.getElementById('editSupersetThumb');
  tog.style.background = _editSupersetOn ? 'var(--accent)' : 'var(--border)';
  thumb.style.left = _editSupersetOn ? '20px' : '2px';
  // Geçici olarak toggle state'i güncelle — save'de uygulanacak
  ex._tempSupersetToggle = _editSupersetOn;
}

function closeEditExerciseModal() {
  // Temp toggle temizle
  if (editingExerciseIdx !== null) {
    const ex = state.days[activeDay]?.exercises[editingExerciseIdx];
    if (ex) delete ex._tempSupersetToggle;
  }
  document.getElementById('editExerciseOverlay').classList.remove('open');
  document.body.style.overflow = '';
  editingExerciseIdx = null;
}

function saveEditExercise() {
  if (editingExerciseIdx === null) return;
  const exs = state.days[activeDay].exercises;
  const ex = exs[editingExerciseIdx];
  const name = document.getElementById('editExName').value.trim();
  if (!name) { document.getElementById('editExName').focus(); return; }
  ex.name = name;
  ex.sets = parseInt(document.getElementById('editExSets').value) || ex.sets;
  ex.reps = document.getElementById('editExReps').value.trim() || ex.reps;
  ex.note = document.getElementById('editExNote').value.trim();

  // Superset toggle uygula
  if (editingExerciseIdx > 0) {
    const wantSS = !!ex._tempSupersetToggle || (ex.ssGroup && ex._tempSupersetToggle !== false);
    // Toggle değiştirildiyse
    if (ex._tempSupersetToggle !== undefined) {
      if (ex._tempSupersetToggle) {
        // SS ekle — bir önceki egzersizle aynı gruba kat
        const prev = exs[editingExerciseIdx - 1];
        if (prev.ssGroup) {
          ex.ssGroup = prev.ssGroup;
        } else {
          const newGroup = 'ss_' + Date.now();
          prev.ssGroup = newGroup;
          ex.ssGroup = newGroup;
        }
      } else {
        // SS kaldır
        const oldGroup = ex.ssGroup;
        ex.ssGroup = null;
        // Grup tek üye kaldıysa onu da temizle
        if (oldGroup) {
          const remaining = exs.filter(e => e.ssGroup === oldGroup);
          if (remaining.length <= 1) remaining.forEach(e => { e.ssGroup = null; });
        }
      }
    }
    delete ex._tempSupersetToggle;
  }

  saveState();
  closeEditExerciseModal();
  render();
}

let libraryActiveGroup = null;

function renderLibrary() {
  const filters = document.getElementById('libraryFilters');
  const list = document.getElementById('libraryList');
  if (!filters || !list) return;

  const searchTerm = (document.getElementById('newExName')?.value || '').toLowerCase().trim();

  // Arama aktifse filtre butonlarını gizle
  filters.style.display = searchTerm ? 'none' : '';

  if (!searchTerm) {
    // Normal grup filtresi
    filters.innerHTML = '';
    const allBtn = document.createElement('button');
    allBtn.textContent = t('allExercises');
    allBtn.style.cssText = `padding:5px 12px;border-radius:20px;border:1px solid var(--border);font-size:12px;font-weight:600;cursor:pointer;background:${libraryActiveGroup === null ? 'var(--accent)' : 'var(--surface2)'};color:${libraryActiveGroup === null ? '#fff' : 'var(--text-secondary)'};`;
    allBtn.onclick = () => { libraryActiveGroup = null; renderLibrary(); };
    filters.appendChild(allBtn);

    Object.entries(EXERCISE_LIBRARY).forEach(([key, group]) => {
      const btn = document.createElement('button');
      btn.textContent = exGroupLabel(group);
      const isActive = libraryActiveGroup === key;
      btn.style.cssText = `padding:5px 12px;border-radius:20px;border:1px solid var(--border);font-size:12px;font-weight:600;cursor:pointer;background:${isActive ? 'var(--accent)' : 'var(--surface2)'};color:${isActive ? '#fff' : 'var(--text-secondary)'};`;
      btn.onclick = () => { libraryActiveGroup = key; renderLibrary(); };
      filters.appendChild(btn);
    });
  }

  // Chip'leri oluştur
  list.innerHTML = '';
  const groups = searchTerm
    ? EXERCISE_LIBRARY // arama varsa tüm gruplarda ara
    : (libraryActiveGroup ? { [libraryActiveGroup]: EXERCISE_LIBRARY[libraryActiveGroup] } : EXERCISE_LIBRARY);

  Object.values(groups).forEach(group => {
    group.exercises.forEach(name => {
      if (searchTerm && !name.toLowerCase().includes(searchTerm)) return;
      const chip = document.createElement('button');
      chip.textContent = name;
      chip.style.cssText = 'padding:4px 10px;border-radius:20px;border:1px solid var(--border);font-size:12px;background:var(--surface2);color:var(--text);cursor:pointer;white-space:nowrap;';
      chip.onclick = () => {
        document.getElementById('newExName').value = name;
        chip.style.background = 'var(--accent)';
        chip.style.color = '#fff';
        chip.style.borderColor = 'var(--accent)';
        list.querySelectorAll('button').forEach(c => {
          if (c !== chip) { c.style.background = 'var(--surface2)'; c.style.color = 'var(--text)'; c.style.borderColor = 'var(--border)'; }
        });
        // Chip seçilince aramayı sıfırla
        renderLibrary();
      };
      list.appendChild(chip);
    });
  });

  // Sonuç yoksa mesaj göster
  if (searchTerm && list.children.length === 0) {
    list.innerHTML = `<span style="font-size:12px;color:var(--text-muted);padding:4px">${t('noResultsFound')}</span>`;
  }
}

function openAddExerciseModal() {
  document.getElementById('newExName').value = '';
  document.getElementById('newExSets').value = '';
  document.getElementById('newExReps').value = '';
  document.getElementById('newExNote').value = '';
  // Reset superset toggle
  _supersetNew = false;
  const tog = document.getElementById('supersetToggle');
  const thumb = document.getElementById('supersetThumb');
  if (tog) { tog.style.background = 'var(--border)'; }
  if (thumb) { thumb.style.left = '2px'; }
  // Hide superset option if no previous exercise
  const hasPrev = state.days[activeDay].exercises.length > 0;
  const ssRow = document.getElementById('supersetRow');
  if (ssRow) ssRow.style.display = hasPrev ? '' : 'none';
  libraryActiveGroup = null;
  renderLibrary();
  document.getElementById('addExerciseOverlay').classList.add('open');
  unlockScroll();
  document.body.style.overflow = 'hidden';
  initModalSwipe();
}

let _supersetNew = false;
function toggleSupersetNew() {
  _supersetNew = !_supersetNew;
  const tog = document.getElementById('supersetToggle');
  const thumb = document.getElementById('supersetThumb');
  tog.style.background = _supersetNew ? 'var(--accent)' : 'var(--border)';
  thumb.style.left = _supersetNew ? '20px' : '2px';
}
function closeAddExerciseModal() {
  const modal = document.querySelector('#addExerciseOverlay .modal');
  if (modal) modal._swipeInit = false;
  document.getElementById('addExerciseOverlay').classList.remove('open');
  document.body.style.overflow = '';
  updateMainScroll();
}

function initModalSwipe() {
  const modal = document.querySelector('#addExerciseOverlay .modal');
  if (!modal || modal._swipeInit) return;
  modal._swipeInit = true;
  let startY = 0, currentY = 0, dragging = false;

  function onStart(e) {
    const libraryList = document.getElementById('libraryList');
    if (libraryList && libraryList.contains(e.target)) { dragging = false; return; }
    const touch = e.touches ? e.touches[0] : e;
    startY = touch.clientY;
    currentY = 0;
    dragging = true;
    modal.style.transition = 'none';
  }
  function onMove(e) {
    if (!dragging) return;
    const touch = e.touches ? e.touches[0] : e;
    currentY = touch.clientY - startY;
    if (currentY < 0) currentY = 0;
    modal.style.transform = `translateY(${currentY}px)`;
  }
  function onEnd() {
    if (!dragging) return;
    dragging = false;
    modal.style.transition = '';
    if (currentY > 100) {
      modal.style.transform = '';
      closeAddExerciseModal();
    } else {
      modal.style.transform = 'translateY(0)';
    }
  }
  modal.addEventListener('touchstart', onStart, { passive: true });
  modal.addEventListener('touchmove', onMove, { passive: false });
  modal.addEventListener('touchend', onEnd);
}
function addExercise() {
  const name = document.getElementById('newExName').value.trim();
  if (!name) { document.getElementById('newExName').focus(); return; }
  const sets = parseInt(document.getElementById('newExSets').value) || 3;
  const reps = document.getElementById('newExReps').value.trim() || '10';
  const note = document.getElementById('newExNote').value.trim();
  const exs = state.days[activeDay].exercises;
  let ssGroup = null;
  if (_supersetNew && exs.length > 0) {
    const prevEx = exs[exs.length - 1];
    if (prevEx.ssGroup) {
      ssGroup = prevEx.ssGroup;
    } else {
      // Yeni grup ID oluştur
      ssGroup = 'ss_' + Date.now();
      prevEx.ssGroup = ssGroup;
    }
  }
  exs.push({ name, sets, reps, note, ssGroup });
  const newIdx = exs.length - 1;
  saveState();
  closeAddExerciseModal();
  render();
  requestAnimationFrame(() => {
    const card = document.getElementById(`card-${newIdx}`);
    if (card) card.classList.add('adding');
  });
}

function scrollTabs(dir) {

function scrollTabToCenter(i) {
  const container = document.getElementById('dayTabs');
  if (!container) return;
  const tabs = container.querySelectorAll('.day-tab');
  const tab = tabs[i];
  if (!tab) return;
  const containerRect = container.getBoundingClientRect();
  const tabRect = tab.getBoundingClientRect();
  const tabCenterRelative = tabRect.left - containerRect.left + tabRect.width / 2;
  const targetScroll = container.scrollLeft + tabCenterRelative - containerRect.width / 2;
  const maxScroll = container.scrollWidth - container.clientWidth;
  const clampedScroll = Math.max(0, Math.min(targetScroll, maxScroll));
  container.scrollTo({ left: clampedScroll, behavior: 'smooth' });
  setTimeout(updateArrows, 300);
}
function updateArrows() {
  const tabs = document.getElementById('dayTabs');
  const left = document.getElementById('arrowLeft');
  const right = document.getElementById('arrowRight');
  if (!tabs || !left || !right) return;
  left.disabled = tabs.scrollLeft <= 2;
  right.disabled = tabs.scrollLeft + tabs.clientWidth >= tabs.scrollWidth - 2;
}

function initTabSwipe(contentEl, tabBar) {
  const sidebarBody = document.getElementById('sidebarBody');
  if (!sidebarBody || sidebarBody._tabSwipeInit) return;
  sidebarBody._tabSwipeInit = true;
  let startX = 0, startY = 0, direction = null;

  sidebarBody.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    direction = null;
  }, { passive: true });

  sidebarBody.addEventListener('touchmove', e => {
    if (direction) return;
    const dx = Math.abs(e.touches[0].clientX - startX);
    const dy = Math.abs(e.touches[0].clientY - startY);
    if (dx > 10 || dy > 10) {
      direction = dx > dy ? 'horizontal' : 'vertical';
    }
  }, { passive: true });

  sidebarBody.addEventListener('touchend', e => {
    if (direction !== 'horizontal') return;
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) < 60) return;
    const tabs = [...tabBar.querySelectorAll('button[data-tab]')];
    const activeIdx = tabs.findIndex(b => b.style.color === 'var(--accent)');
    if (dx < 0 && activeIdx < tabs.length - 1) tabs[activeIdx + 1].click();
    else if (dx > 0 && activeIdx > 0) tabs[activeIdx - 1].click();
  }, { passive: true });
}

function initSettingsSwipe() {
  const sheet = document.querySelector('.settings-sheet');
  if (!sheet || sheet._swipeInit) return;
  sheet._swipeInit = true;
  let startY = 0, currentY = 0, dragging = false;

  function onStart(e) {
    const touch = e.touches ? e.touches[0] : e;
    startY = touch.clientY;
    currentY = 0;
    dragging = true;
    sheet.style.transition = 'none';
  }
  function onMove(e) {
    if (!dragging) return;
    const touch = e.touches ? e.touches[0] : e;
    currentY = touch.clientY - startY;
    if (currentY < 0) currentY = 0;
    sheet.style.transform = `translateY(${currentY}px)`;
  }
  function onEnd() {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = '';
    if (currentY > 100) {
      sheet.style.transform = '';
      closeSettings();
    } else {
      sheet.style.transform = '';
    }
  }
  sheet.addEventListener('touchstart', onStart, { passive: true });
  sheet.addEventListener('touchmove', onMove, { passive: true });
  sheet.addEventListener('touchend', onEnd);
}

function initSidebarSwipe() {
  if (window.innerWidth <= 600) return;
  const sidebar = document.getElementById('sidebar');
  if (!sidebar || sidebar._swipeInit) return;
  sidebar._swipeInit = true;

  const body = document.getElementById('sidebarBody');

}

function calcWorkoutStats() {
  const isReadonly = viewingWeek !== null;
  const weekData = isReadonly ? history[viewingWeek] : null;
  const days = isReadonly ? (weekData?.days || state.days) : state.days;
  const sets = isReadonly ? (weekData?.sets || {}) : sessionSets;
  const day = days[activeDay];
  if (!day) return { done: 0, total: 0, volume: 0, exercises: 0 };
  let done = 0, total = 0, volume = 0, exercises = 0;
  day.exercises.forEach((ex, ei) => {
    let exDone = 0;
    for (let si = 0; si < ex.sets; si++) {
      total++;
      const s = sets[`${activeDay}-${ei}-${si}`];
      if (s && s.done) {
        done++;
        exDone++;
        const kg = parseFloat(s.kg) || 0;
        const reps = parseFloat((s.reps || '').toString().split('-')[0]) || 0;
        volume += kg * reps;
      }
    }
    if (exDone > 0) exercises++;
  });
  return { done, total, volume: Math.round(volume), exercises };
}

function calcLastWeekVolume() {
  try {
    const history = JSON.parse(localStorage.getItem('antrenman_history_v1') || '{}');
    const keys = Object.keys(history).sort();
    if (keys.length < 1) return null;
    const lastKey = keys[keys.length - 1];
    const lastWeek = history[lastKey];
    const dayData = lastWeek && lastWeek[activeDay];
    if (!dayData || !dayData.exercises) return null;
    let volume = 0;
    dayData.exercises.forEach((ex, ei) => {
      const sets = (dayData.sessionSets && dayData.sessionSets[ei]) || {};
      for (let si = 0; si < ex.sets; si++) {
        const s = sets[si];
        if (s && s.done) {
          const kg = parseFloat(s.kg) || 0;
          const reps = parseFloat((s.reps || '').toString().split('-')[0]) || 0;
          volume += kg * reps;
        }
      }
    });
    return Math.round(volume);
  } catch(e) { return null; }
}

function detectPRs() {
  const day = state.days[activeDay];
  if (!day) return [];
  const currentKey = getCurrentWeekKey();
  const prs = [];
  day.exercises.forEach((ex, ei) => {
    let maxKg = 0;
    for (let si = 0; si < ex.sets; si++) {
      const s = sessionSets[`${activeDay}-${ei}-${si}`];
      if (s && s.done) maxKg = Math.max(maxKg, parseFloat(s.kg) || 0);
    }
    if (maxKg === 0) return;
    let prevMax = 0;
    Object.entries(history).forEach(([key, week]) => {
      if (key === currentKey) return; // bu haftayı atla
      if (!week.sets) return;
      for (let si = 0; si < ex.sets; si++) {
        const s = week.sets[`${activeDay}-${ei}-${si}`];
        if (s && s.done) prevMax = Math.max(prevMax, parseFloat(s.kg) || 0);
      }
    });
    if (maxKg > prevMax) prs.push(ex.name);
  });
  return prs;
}

function showWorkoutSummary(elapsed, hideResume) {
  const stats = calcWorkoutStats();
  const lastVol = calcLastWeekVolume();
  const prs = detectPRs();
  const pad = n => String(n).padStart(2, '0');
  const h = Math.floor(elapsed / 3600);
  const m = Math.floor((elapsed % 3600) / 60);
  const s = elapsed % 60;
  const durStr = h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;

  let vsStr = t('summaryNoLastWeek');
  let vsColor = 'var(--text-secondary)';
  if (lastVol !== null && lastVol > 0 && stats.volume > 0) {
    const diff = Math.round((stats.volume - lastVol) / lastVol * 100);
    vsStr = (diff >= 0 ? '+' : '') + diff + '%';
    vsColor = diff >= 0 ? 'var(--green)' : '#ff3b30';
  }

  const cardStyle = 'background:var(--surface2);border-radius:12px;padding:12px 14px';
  const labelStyle = 'font-size:11px;color:var(--text-secondary);margin-bottom:4px';
  const valStyle = 'font-size:22px;font-weight:700;color:var(--text);letter-spacing:-0.5px';

  document.getElementById('summaryTitle').textContent = t('workoutSummary');
  document.getElementById('summaryCards').innerHTML = `
    <div style="${cardStyle}">
      <div style="${labelStyle}">${t('summaryDuration')}</div>
      <div style="${valStyle}">${durStr}</div>
    </div>
    <div style="${cardStyle}">
      <div style="${labelStyle}">${t('summarySets')}</div>
      <div style="${valStyle}">${stats.done}<span style="font-size:14px;color:var(--text-secondary);font-weight:500">/${stats.total}</span></div>
    </div>
    <div style="${cardStyle}">
      <div style="${labelStyle}">${t('summaryVolume')}</div>
      <div style="${valStyle}">${stats.volume.toLocaleString()}<span style="font-size:13px;color:var(--text-secondary);font-weight:500"> ${weightUnit}</span></div>
    </div>
    <div style="${cardStyle}">
      <div style="${labelStyle}">${t('summaryVsLastWeek')}</div>
      <div style="font-size:22px;font-weight:700;letter-spacing:-0.5px;color:${vsColor}">${vsStr}</div>
    </div>
  `;
  const prCard = document.getElementById('summaryPRCard');
  if (prs.length > 0) {
    const shown = prs.slice(0, 3);
    const rest = prs.length - shown.length;
    prCard.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${shown.length > 0 ? '8px' : '0'}">
        <span style="color:var(--text-secondary);font-size:12px">${t('summaryPR')}</span>
        ${rest > 0 ? `<button onclick="openPRPanel()" style="font-size:11px;font-weight:600;color:var(--accent);background:none;border:none;cursor:pointer;padding:0">+${rest} ${t('moreResults')} →</button>` : ''}
      </div>
      ${shown.map(name => `<div style="display:flex;align-items:center;gap:6px;padding:3px 0"><span style="font-size:13px">🏆</span><span style="font-size:13px;font-weight:500;color:var(--text)">${name}</span></div>`).join('')}
    `;
  } else {
    prCard.innerHTML = `<span style="color:var(--text-muted)">${t('summaryNoPR')}</span>`;
  }
  document.getElementById('summaryCloseBtn').textContent = t('summaryClose');
  document.getElementById('summaryResumeBtn').textContent = t('summaryResume');
  document.getElementById('summaryResumeBtn').style.display = hideResume ? 'none' : '';
  document.getElementById('workoutSummaryOverlay').classList.add('open');
  requestAnimationFrame(() => {
    const m = document.getElementById('workoutSummaryModal');

}

  { id: 'gray',    light: '#636366', dark: '#98989d', name: 'Gri' },
