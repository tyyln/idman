let accentId = 'green';

function applyAccent(id) {
  accentId = id;
  const color = ACCENT_COLORS.find(c => c.id === id) || ACCENT_COLORS[0];
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const hex = isDark ? color.dark : color.light;
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const root = document.documentElement.style;
  root.setProperty('--accent', hex);
  root.setProperty('--accent-hover', hex);
  root.setProperty('--accent-soft', `rgba(${r},${g},${b},0.12)`);
  const lum = 0.2126 * (r/255) ** 2.2 + 0.7152 * (g/255) ** 2.2 + 0.0722 * (b/255) ** 2.2;
  let textHex = hex;
  if (!isDark && lum > 0.35) {
    const f = 0.45;
    textHex = `#${Math.round(r*f).toString(16).padStart(2,'0')}${Math.round(g*f).toString(16).padStart(2,'0')}${Math.round(b*f).toString(16).padStart(2,'0')}`;
  }
  root.setProperty('--accent-text', textHex);
  try { localStorage.setItem('antrenman_accent', id); } catch(e) {}
  renderAccentSwatches();
}

function renderAccentSwatches() {
  const wrap = document.getElementById('accentSwatches');
  if (!wrap) return;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  wrap.innerHTML = '';
  ACCENT_COLORS.forEach(c => {
    const hex = isDark ? c.dark : c.light;
    const btn = document.createElement('button');
    btn.title = c.name;
    btn.style.cssText = `width:32px;height:32px;border-radius:50%;border:none;background:${hex};cursor:pointer;transition:transform 0.15s;flex-shrink:0;position:relative;`;
    if (c.id === accentId) {
      btn.style.boxShadow = `0 0 0 2.5px var(--surface), 0 0 0 4.5px ${hex}`;
      btn.style.transform = 'scale(1.1)';
    }
    btn.onclick = () => applyAccent(c.id);
    wrap.appendChild(btn);
  });
}

// Load saved accent
(function() {
  try {
    const saved = localStorage.getItem('antrenman_accent');
    if (saved && ACCENT_COLORS.find(c => c.id === saved)) accentId = saved;
    applyAccent(accentId);
  } catch(e) { applyAccent('green'); }
})();

function exportData() {
  const backup = {
    version: 2,
    exportedAt: new Date().toISOString(),
    state: state,
    history: history,
    sessionSets: { ...sessionSets, _weekKey: getCurrentWeekKey() },
    weightLog: loadWeightLog(),
    bioLog: loadBioLog(),
    settings: {
      theme: localStorage.getItem('antrenman_theme') || 'light',
      lang: localStorage.getItem('antrenman_lang') || 'en',
      unit: localStorage.getItem('antrenman_unit') || 'kg',
        lengthUnit: localStorage.getItem('antrenman_length_unit') || 'cm',
      accent: localStorage.getItem('antrenman_accent') || 'blue',
    },
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `antrenman-yedek-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const backup = JSON.parse(e.target.result);
      if (!backup.state || !backup.history) throw new Error('invalid');

      state = backup.state;
      history = backup.history;

      // sessionSets — sadece aynı haftanınkini al
      const currentKey = getCurrentWeekKey();
      const backupWeekKey = backup.sessionSets?._weekKey;
      if (backupWeekKey === currentKey) {
        const { _weekKey, ...sets } = backup.sessionSets;
        sessionSets = sets;
      } else {
        sessionSets = {};
      }

      if (backup.weightLog) {
        try { localStorage.setItem(WEIGHT_KEY, JSON.stringify(backup.weightLog)); } catch(err) {}
      }
      if (backup.bioLog) {
        try { localStorage.setItem(BIO_KEY, JSON.stringify(backup.bioLog)); } catch(err) {}
      }

      // Ayarları geri yükle
      if (backup.settings) {
        const s = backup.settings;
        if (s.theme) { applyTheme(s.theme === 'dark'); }
        if (s.lang) { lang = s.lang; try { localStorage.setItem('antrenman_lang', lang); } catch(e) {} }
        if (s.unit) { weightUnit = s.unit; try { localStorage.setItem('antrenman_unit', weightUnit); } catch(e) {} }
        if (s.lengthUnit) { setLengthUnit(s.lengthUnit); }
        if (s.accent) { accentId = s.accent; applyAccent(accentId); }
      }

      // activeDay'i bugüne ayarla
      activeDay = getTodayIndex();

      saveState();
      try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch(err) {}
      saveSession();
      closeSettings();
      carryOverLastWeek();
      render();
      applyI18n();
      applyIcons();
      showFlash(t('restoreSuccess'));
    } catch(err) {
      console.error('Import error:', err);
      showFlash(t('restoreError'));
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  applyTheme(!isDark);
}

// Load saved theme
(function() {
  try {
    const saved = localStorage.getItem('antrenman_theme');
    applyTheme(saved ? saved === 'dark' : false);
  } catch(e) { applyTheme(false); }
})();

// Save to history periodically and on page hide
document.addEventListener('visibilitychange', () => { if (document.hidden) saveCurrentWeekToHistory(); });
window.addEventListener('beforeunload', saveCurrentWeekToHistory);

document.documentElement.style.visibility = 'hidden';
document.body.classList.add('preload');
render();
applyI18n();
window.addEventListener('load', () => {
  applyIcons();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.body.classList.remove('preload');
    document.documentElement.style.visibility = '';
  }));
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js');
  });
}
</script>
